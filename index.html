<html lang="es">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700;800&display=swap');
:root{ --accent:#C9663D; --accent2:#2F8F5B; --ink:#161513; --mute:#8A867E; --mute2:#6B675F; --bg:#F2F3F5; --line:#E4E6E9; --line2:#D9DCE0; --card-line:#E8EAED; }

body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:#fff}

img{max-width:100%;display:block}

.herocard img{width:110%;max-width:none;margin:0 -2% 0 -8%;position:relative;z-index:1;mix-blend-mode:multiply}

.hero-price{position:absolute;right:0;bottom:4px;text-align:right}

.hero-price .cap{font-size:12px;color:var(--mute);max-width:160px;line-height:1.3;font-weight:600}
.hero-tone{position:absolute;left:0;bottom:8px;display:flex;align-items:center;gap:10px}
.hero-tone span.lbl{font-weight:800;font-size:13px}
@media(max-width:900px){.herocard{padding:0 0 100px}.herocard img{width:108%;margin:0 -4%}.hero-price{bottom:0}.hero-tone{bottom:58px}}

.chips{padding:8px 40px 56px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
@media(max-width:900px){.chips{padding:8px 20px 40px}}
.chip{padding:12px 18px;border-radius:999px;border:1.5px solid var(--line2);font-weight:700;font-size:14px}

section.catalog{padding:64px 40px;background:var(--bg)}

.claim-banner{background:#fff;padding:64px 40px 44px}
.cbig{margin:0;max-width:780px}
.cbig-line{display:block;font-family:'Unbounded',sans-serif;font-weight:900;letter-spacing:-.03em;line-height:1.08}
.cbig-line.cbig-orange{color:var(--accent);font-size:clamp(22px,3.4vw,38px);margin-bottom:4px}
.cbig-line.cbig-ink{color:var(--ink);font-size:clamp(24px,3.9vw,44px)}
@media(max-width:900px){.claim-banner{padding:44px 20px}}
.catalog-head-simple{margin-bottom:32px}
.catalog-head-simple h2{margin:0;font-weight:900;font-size:clamp(28px,4vw,44px);letter-spacing:-.03em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid4{grid-template-columns:1fr}}
.grid5{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.grid5 .card{padding:16px;gap:14px}

.grid5 .card h3{font-size:19px}

.grid5 .card .toprow{flex-direction:column;gap:2px}
.grid5 .card .desc{font-size:13px;min-height:72px}

@media(max-width:1180px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:860px){.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid5{grid-template-columns:1fr}.grid5 .card .imgbox{height:250px}.grid5 .card .toprow{flex-direction:row}.grid5 .card .tonerow{flex-direction:row;align-items:center}.grid5 .card .actions{flex-direction:row}.grid5 .card .actions .btn-primary,.grid5 .card .actions .btn-secondary{flex:1;width:auto}}
.card{background:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.card .imgbox{position:relative;height:230px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;padding:34px 4px 8px}
.card .imgbox a{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.card .imgbox img{width:100%;height:100%;object-fit:contain;cursor:pointer;transform:scale(1.18);transform-origin:center}
/* el sillón es una pieza chica: se muestra a menor escala para no verse más grande que el sofá.
   el transform:scale de arriba agranda TODAS las fotos por el mismo factor, así que la proporción
   entre piezas se mantiene igual que antes — nada queda desbalanceado. */
.card .imgbox img.p-sillon{width:auto;height:56%}
.card .tag{position:absolute;top:12px;left:12px;background:var(--accent);color:#fff;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700}
.card h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;cursor:pointer}
.card .toprow{display:flex;justify-content:space-between;align-items:baseline}
.card .price{font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;color:var(--accent)}
.card .desc{margin:-4px 0 0;font-size:14px;color:var(--mute2);line-height:1.4;min-height:38px}
.msi-box{margin-top:-8px;background:var(--bg);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.msi-lbl{font-weight:800;font-size:12.5px;color:var(--ink)}
.msi-opts{display:flex;flex-wrap:wrap;gap:10px}
.msi-opts span{font-size:12px;font-weight:700;color:var(--mute2);display:flex;align-items:baseline;gap:3px}
.msi-opts span::before{content:'x';font-size:11px;color:var(--mute)}
.msi-opts span b{font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;color:var(--mute2)}
.msi-note{font-size:10.5px;color:var(--mute);font-weight:600;line-height:1.3}
.grid5 .card .msi-opts{gap:8px}
.grid5 .card .msi-opts span{font-size:11px}
.card .tonerow{display:flex;justify-content:space-between;align-items:center}
.card .tonerow .lbl{font-weight:800;font-size:13px}
.card .swrow{display:flex;gap:5px}
.card .swatch{width:32px;height:32px}
.card .actions{display:flex;gap:8px}
.card .actions .btn-primary,.card .actions .btn-secondary{height:48px;font-size:14px;flex:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .25s;z-index:200}
.toast.show{transform:translateX(-50%) translateY(0)}

.telas{padding:0 40px 56px}
@media(max-width:900px){.telas{padding:0 20px 40px}}
.telas-inner{border-radius:28px;background:var(--bg);padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}

.telas h2{margin:0;font-weight:900;font-size:clamp(30px,4vw,48px);line-height:1;letter-spacing:-.03em}

.pins{display:flex;gap:14px;flex-wrap:wrap}
.pin{width:88px;height:88px;border-radius:14px;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.08)}

.qa{padding:16px 40px 56px;max-width:900px;margin:0 auto}

.qa h2{font-weight:900;font-size:clamp(30px,4vw,46px);letter-spacing:-.03em}
.qa-item{display:flex;gap:28px;padding:24px 0;border-bottom:1px solid var(--line);align-items:baseline}
@media(max-width:700px){.qa-item{flex-direction:column;gap:8px}}

.qa-item .a{font-size:19px;font-weight:700;line-height:1.4}
.qa-item .a b{font-family:'Unbounded',sans-serif;color:var(--accent)}
.qa-item .a small{display:block;margin-top:4px;font-size:14px;font-weight:600;color:var(--mute2);line-height:1.4}

.steps{padding:56px 40px;display:flex;flex-direction:column;gap:36px}

.planner{padding:56px 40px}
@media(max-width:900px){.planner{padding:40px 20px}}
.planner-inner{border-radius:28px;background:var(--bg);padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
@media(max-width:900px){.planner-inner{grid-template-columns:1fr;padding:28px}}
.planner h2{margin:0;font-weight:900;font-size:clamp(30px,4vw,48px);line-height:1;letter-spacing:-.03em}

.pform{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pform label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px}
.pform input{width:100px;height:48px;border-radius:12px;border:1.5px solid var(--line2);padding:0 12px;font-family:'Unbounded',sans-serif;font-size:16px}
.plot-box{background:#fff;border-radius:20px;padding:20px}

footer.site{padding:56px 40px 40px;border-top:3px solid var(--accent);display:flex;flex-direction:column;gap:28px}
@media(max-width:900px){footer.site{padding:40px 20px}}
.foot-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:24px}
.foot-logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(60px,10vw,140px);color:var(--accent);letter-spacing:-.05em;line-height:.85}
.foot-links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 48px;font-weight:700;font-size:15px}
.foot-bottom{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;border-top:1px solid #ECECEA;padding-top:20px;flex-wrap:wrap;gap:8px}

/* Product page */
.pdp{padding:32px 40px 80px;display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:flex-start}
@media(max-width:900px){.pdp{grid-template-columns:minmax(0,1fr);padding:20px 20px 56px}}
.pdp>*{min-width:0}
@media(max-width:900px){.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabbtn{white-space:nowrap;padding:14px 14px}}
.gallery{position:sticky;top:104px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:900px){.gallery{position:static}}
.gal-main{position:relative;border-radius:24px;background:#fff;border:1px solid var(--card-line);padding:14px;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;min-width:0;overflow:hidden;touch-action:pan-y}
.gal-main img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;pointer-events:none}
.gal-main.full{padding:0}
.gal-main.full img{object-fit:cover}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid var(--card-line);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 8px 20px rgba(20,24,31,.1);opacity:.9}

.gal-thumb em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:9px;font-weight:800;color:#fff;background:rgba(22,21,19,.62);padding:2px 0;text-align:center;letter-spacing:.02em}

.qtyrow{display:flex;align-items:center;gap:14px;margin:18px 0}

.reviews{padding:16px 40px 64px}

.fit-diagram{position:relative;background:var(--bg);border-radius:24px;padding:0 32px;overflow-x:auto}
.fit-stage{display:flex;align-items:flex-end;gap:18px;position:relative;padding:36px 24px 0 0;width:max-content;min-width:100%}
.fit-door{display:flex;flex-direction:column;align-items:center;flex:none;padding-bottom:52px}
.fit-door .bar{width:3px;background:repeating-linear-gradient(180deg,var(--mute2) 0 6px,transparent 6px 12px)}
.fit-door .lbl{margin-top:10px;font-size:12px;font-weight:800;color:var(--mute2);text-align:center;line-height:1.3;white-space:nowrap}
.fit-group{display:flex;flex-direction:column;align-items:center;flex:none;padding-bottom:52px}
.fit-gname{font-family:'Unbounded',sans-serif;font-weight:900;font-size:14px;letter-spacing:-.02em;margin-bottom:2px;white-space:nowrap}
.fit-gnote{font-size:11.5px;color:var(--mute2);font-weight:700;margin-bottom:16px}
.fit-row{display:flex;align-items:flex-end;gap:12px}
.fit-piece{display:flex;flex-direction:column;align-items:center}
.fit-box{background:linear-gradient(180deg,#EFD9CC,#DFAF92);border:2px solid var(--accent);border-radius:8px 8px 3px 3px;position:relative;display:flex;align-items:flex-start;justify-content:center}
.fit-box span{font-family:'Unbounded',sans-serif;font-weight:800;font-size:11px;color:#7A3E22;margin-top:8px}
.fit-dim{margin-top:8px;font-size:11px;font-weight:700;color:var(--mute2);white-space:nowrap}
.fit-cotawrap{display:flex;align-items:flex-end;margin-left:4px}
.fit-cota{display:flex;flex-direction:column;align-items:center}
.fit-cota .line{width:2px;background:var(--ink);position:relative}
.fit-cota .line::before,.fit-cota .line::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
.fit-cota .line::before{top:-1px;border-top:7px solid var(--ink)}
.fit-cota .line::after{bottom:-1px;border-bottom:7px solid var(--ink)}
.fit-cota-val{margin-top:8px;font-family:'Unbounded',sans-serif;font-weight:900;font-size:12.5px;color:var(--ink);white-space:nowrap}
.fit-foot{margin-top:24px;display:flex;gap:14px;align-items:flex-start;background:var(--bg);border-radius:16px;padding:18px 20px}
.fit-foot b{font-family:'Unbounded',sans-serif;font-size:14px}
.fit-foot p{margin:4px 0 0;font-size:13.5px;color:var(--mute2);font-weight:600;line-height:1.5}

/* ===== Configurador de espacio ===== */
.pl{display:flex;flex-direction:column;gap:22px;background:var(--bg);border-radius:28px;padding:36px}
@media(max-width:900px){.pl{padding:22px 16px;border-radius:22px}}
.pl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.pl-head h2{margin:14px 0 10px;font-weight:900;font-size:clamp(30px,4vw,48px);line-height:1;letter-spacing:-.03em}
.pl-head p{margin:0;color:var(--mute2);font-size:15px;max-width:460px;line-height:1.5}
.pl-room{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pl-room label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:11px;color:var(--mute2);text-transform:uppercase;letter-spacing:.08em}
.pl-room label span{display:flex;align-items:center;gap:4px;height:48px;border:1.5px solid var(--line2);border-radius:14px;padding:0 12px;background:#fff;font-size:14px;color:var(--mute);text-transform:none;letter-spacing:0}
.pl-room label span:focus-within{border-color:var(--ink)}
.pl-room input{width:58px;border:none;outline:none;font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;background:none;color:var(--ink);padding:0}
.pl-btn2{height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:14px;color:var(--ink)}
.pl-btn2:hover{border-color:var(--ink)}

.pl-body{display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.pl-body{grid-template-columns:1fr}}
.pl-palette{display:flex;flex-direction:column;gap:10px}
.pl-pal-t{font-weight:800;font-size:11px;color:var(--mute2);text-transform:uppercase;letter-spacing:.08em;padding:0 4px 2px}
@media(max-width:900px){
  .pl-palette{flex-direction:row;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .pl-pal-t{display:none}
}
.pl-card{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid transparent;border-radius:18px;padding:10px 12px 10px 8px;text-align:left;cursor:grab;user-select:none;-webkit-user-select:none;transition:border-color .15s,transform .1s,box-shadow .15s}
.pl-card:hover{border-color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.pl-card:active{cursor:grabbing;transform:scale(.98)}
@media(max-width:900px){.pl-card{min-width:248px;scroll-snap-align:start}}
.pl-card>svg{width:80px;height:58px;flex-shrink:0;pointer-events:none}
.pl-card .t{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;pointer-events:none}
.pl-card b{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700}
.pl-card small{white-space:nowrap;font-size:12px;color:var(--mute);font-weight:700}
.pl-card em{font-style:normal;font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;color:var(--accent);margin-top:2px}
.pl-card .plus{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;pointer-events:none}

.pl-stage{position:relative;background:#fff;border-radius:22px;overflow:hidden}
.pl-svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.pl-svg .pc{cursor:grab}
.pl-svg.dragging,.pl-svg.dragging .pc{cursor:grabbing}
.pl-dim{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:14px;fill:#6B675F;text-anchor:middle}
.pl-cotas{pointer-events:none}
.pl-cota{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:13.5px;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.pl-cota.dim{fill:#161513}
.pl-cota.gap{fill:#C9663D}
.pl-empty{font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:17px;fill:#8A867E}
.pl-hint{position:absolute;left:16px;bottom:14px;font-size:12px;font-weight:700;color:var(--mute);display:flex;gap:6px;align-items:center;pointer-events:none}
.pl-hint kbd{font-family:inherit;font-size:11px;font-weight:800;background:#F1F2F4;border:1px solid #E1E4E8;border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink)}
@media(max-width:700px){.pl-hint{display:none}}
.pl-warn{position:absolute;left:14px;top:14px;background:#FDECEA;color:#B3261E;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;pointer-events:none;max-width:calc(100% - 28px)}

.pl-tb{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--ink);color:#fff;border-radius:16px;padding:9px 10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 32px rgba(0,0,0,.24);white-space:nowrap;animation:plPop .14s ease-out}
.pl-tb[hidden]{display:none}
.pl-tb::after{content:'';position:absolute;left:calc(50% + var(--ax,0px));bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.pl-tb.below{transform:translate(-50%,0)}
.pl-tb.below::after{bottom:auto;top:-6px}
@keyframes plPop{from{opacity:0;margin-top:4px}to{opacity:1;margin-top:0}}
.pl-tb-t{display:flex;gap:10px;align-items:baseline;font-size:12px;padding:0 4px}
.pl-tb-t b{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700}
.pl-tb-t span{color:#B4B1AB;font-weight:700}
.pl-tb-row{display:flex;align-items:center;gap:3px}
.pl-tb .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.pl-tb .ic:hover{background:rgba(255,255,255,.14)}
.pl-tb .ic.del:hover{background:#B3261E}
.pl-tb .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:2px;display:flex}
.pl-tb .sw.sel{border-color:#fff}
.pl-tb .sw span{flex:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pl-tb .sz{height:28px;padding:0 9px;border-radius:8px;font-weight:800;font-size:12px;color:#fff;background:rgba(255,255,255,.1)}
.pl-tb .sz.sel{background:#fff;color:var(--ink)}
.pl-tb .sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 5px}

.pl-sum{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;background:#fff;border-radius:20px;padding:14px 16px 14px 18px}
.pl-list{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:240px}
.pl-none{color:var(--mute);font-weight:700;font-size:14px}
.pl-chip{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 10px;border-radius:999px;border:1.5px solid var(--line2);font-weight:700;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.pl-chip:hover,.pl-chip.sel{border-color:var(--ink)}
.pl-chip.hit{border-color:#D93025;color:#B3261E}
.pl-chip i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pl-chip button{width:24px;height:24px;border-radius:50%;background:#F1F2F4;display:flex;align-items:center;justify-content:center;color:var(--mute2)}
.pl-chip button:hover{background:var(--ink);color:#fff}
.pl-stats{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.pl-stat small{display:block;font-size:10px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pl-stat b{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;letter-spacing:-.02em}
.pl-cart{height:50px;font-size:15px}
.pl-cart[disabled]{opacity:.4;pointer-events:none}
@media(max-width:600px){.pl-stats{width:100%}.pl-cart{width:100%}}
.pl-msi{margin-top:14px}
.pl-msi .msi-box{background:transparent;padding:0;gap:5px}
.pl-msi .msi-lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.pl-msi .msi-opts span{font-size:11.5px}
.pl-msi .msi-opts span b{font-size:12px}

.pl-ghost{position:fixed;pointer-events:none;z-index:300;transform:translate(-50%,-50%) scale(.9);width:120px;opacity:.75;filter:drop-shadow(0 14px 22px rgba(0,0,0,.25));transition:transform .12s,opacity .12s}
.pl-ghost.in{transform:translate(-50%,-50%) scale(1.05);opacity:1}
.pl-ghost svg{width:100%;height:auto;display:block}
@media(max-width:700px){.pl-cota{font-size:26px;stroke-width:8px}.pl-dim{font-size:30px}.pl-empty{font-size:34px}}
@media(max-width:700px){
  .pl-tb,.pl-tb.below{position:static;transform:none;margin:0 10px 10px;animation:none;white-space:normal}
  .pl-tb-t{flex-wrap:wrap;row-gap:2px}
  .pl-tb::after{display:none}
  .pl-tb-row{flex-wrap:wrap;row-gap:6px}
}
@media(max-width:900px){.planner{padding:28px 10px}.planner .wrap{padding:0}}

/* ===== Flete ===== */
.flete{padding:64px 40px 72px}
@media(max-width:900px){.flete{padding:44px 20px 52px}}
.flete .wrap{display:flex;flex-direction:column;gap:28px}
.fl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.fl-head h2{margin:14px 0 0;font-weight:900;font-size:clamp(38px,5.4vw,68px);line-height:.95;letter-spacing:-.04em}
.fl-head h2 em{font-style:normal;color:var(--accent)}
.fl-head p{margin:0;max-width:380px;font-size:17px;line-height:1.45;color:var(--mute2)}
.fl-head p b{color:var(--ink)}

.fl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media(max-width:900px){.fl-grid{grid-template-columns:1fr}}
.fl-card{position:relative;border-radius:28px;padding:28px 26px 26px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.fl-card h3{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.fl-card p{margin:0;font-size:15px;line-height:1.45}
.fl-price{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(40px,4.4vw,56px);letter-spacing:-.04em;line-height:1}
.fl-ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.fl-ic svg{width:30px;height:30px}
.fl-card ul{list-style:none;margin:auto 0 0;padding:14px 0 0;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700}
.fl-card li{display:flex;gap:8px;align-items:center}
.fl-card li svg{width:18px;height:18px;flex-shrink:0}

.fl-card.ya{background:var(--ink);color:#fff}
.fl-card.ya .fl-ic{background:rgba(255,255,255,.1)}
.fl-card.ya p{color:#C9CBD0}
.fl-card.ya li svg{color:var(--accent)}

.fl-card.ruta{background:var(--accent);color:#fff;box-shadow:0 24px 50px rgba(201,102,61,.28)}
.fl-card.ruta .fl-ic{background:rgba(255,255,255,.18)}
.fl-card.ruta p{color:#FBE7DE}
.fl-badge{position:absolute;top:22px;right:22px;background:#fff;color:var(--accent);font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px}
@media(min-width:901px){.fl-card.ruta{transform:translateY(-10px)}}

.fl-card.gratis{background:#fff;border:2px solid var(--ink)}
.fl-card.gratis .fl-ic{background:#EEF3E6;color:#4F6B2E}
.fl-card.gratis p{color:var(--mute2)}
.fl-card.gratis p b{color:var(--ink)}
.fl-pz{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
.fl-pz span{border:1.5px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.fl-pz b{font-family:'Unbounded',sans-serif;color:var(--accent);margin-left:2px}
.fl-ej{font-size:13px;font-weight:700;color:var(--mute2)}
.fl-ej b{color:var(--ink)}

.fl-trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--bg);border-radius:24px;padding:22px}
@media(max-width:1000px){.fl-trust{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.fl-trust{grid-template-columns:1fr}}
.fl-trust>div{display:grid;grid-template-columns:44px 1fr;column-gap:12px;row-gap:2px;align-items:start}
.fl-trust span{grid-row:span 2;width:44px;height:44px;border-radius:14px;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center}
.fl-trust span svg{width:24px;height:24px}
.fl-trust b{font-size:15px;padding-top:2px}
.fl-trust small{font-size:13px;color:var(--mute2);line-height:1.4}

.fl-tag{text-align:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(22px,3.4vw,40px);letter-spacing:-.03em;padding-top:8px}
.fl-tag span{color:var(--accent)}

/* ----- carrito ----- */
.fc{margin-top:24px;background:var(--bg);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.fc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fc-h h3{margin:0;font-size:19px;font-weight:800}
.fc-h span{font-size:13px;font-weight:700;color:var(--mute2)}
.fc-bar{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fc-bar-t{display:flex;align-items:center;gap:8px;font-size:14px}
.fc-bar-t svg{width:20px;height:20px;color:var(--accent);flex-shrink:0}
.fc-bar.ok .fc-bar-t svg{color:#4F6B2E}
.fc-track{height:8px;border-radius:99px;background:var(--line)}
.fc-track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.fc-bar.ok .fc-track i{background:#4F6B2E}
.fc-bar small{font-size:12px;color:var(--mute)}
.fc-opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:16px;padding:14px 16px;cursor:pointer}
.fc-opt.sel{border-color:var(--ink)}
.fc-opt.off{opacity:.45;cursor:default}
.fc-opt input{accent-color:var(--ink);width:18px;height:18px;margin:0}
.fc-ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fc-ic svg{width:22px;height:22px}
.fc-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.fc-t b{font-size:15px}
.fc-t small{font-size:12.5px;color:var(--mute2)}
.fc-p{font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px;white-space:nowrap}
.fc-p s{color:var(--mute);font-weight:600}
.fc-inc{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--mute2);padding:2px 4px}
.fc-inc svg{width:18px;height:18px;color:#4F6B2E;flex-shrink:0}
.cart-lines{margin-top:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.cart-lines>div{display:flex;justify-content:space-between;color:var(--mute2);font-weight:600}
.cart-lines .free{color:#4F6B2E}
.cart-lines+.cart-summary{margin-top:12px}

.cartitem .qtybox{display:inline-flex}

/* ===== acceso discreto ===== */
footer.site{position:relative}
.erp-dot{position:absolute;right:14px;bottom:12px;width:7px;height:7px;border-radius:50%;background:#E4E6E9;display:block;transition:background .2s}
.erp-dot:hover{background:var(--accent)}

/* ===== checkout ===== */
.ck-ov{position:fixed;inset:0;background:rgba(22,21,19,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.ck{position:relative;background:#fff;border-radius:26px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:30px 28px 24px}
.ck-x{position:absolute;top:14px;right:16px;font-size:28px;line-height:1;color:var(--mute2)}
.ck h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.ck-sub{margin:6px 0 18px;color:var(--mute2);font-size:14px}
.ck-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ck-f .w2{grid-column:1/-1}
@media(max-width:520px){.ck-f{grid-template-columns:1fr}}
.ck-f label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;color:var(--mute2)}
.ck-f input,.ck-f select{height:46px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:#fff}
.ck-f input:focus,.ck-f select:focus{outline:none;border-color:var(--ink)}
.ck-tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-size:13px;color:var(--mute2);font-weight:700}
.ck-tot b{font-family:'Unbounded',sans-serif;font-size:24px;color:var(--ink)}
.ck-mp{width:100%;background:#009EE3!important;gap:10px}
.mp-logo{font-family:system-ui,sans-serif;font-weight:400;letter-spacing:-.02em;font-size:14px}
.mp-logo b{font-weight:800}
.ck-note{font-size:12px;color:var(--mute);text-align:center;margin:0}
.mp-sim{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.mp-top{display:flex;gap:10px;align-items:center}
.mp-logo.big{font-size:22px;color:#009EE3}
.mp-tag{font-size:10px;font-weight:800;letter-spacing:.08em;background:#FFF1CC;color:#7A5A00;padding:4px 8px;border-radius:6px}
.mp-amt{font-family:'Unbounded',sans-serif;font-weight:900;font-size:40px}
.mp-sim p{margin:0;color:var(--mute2)}
.mp-btns{display:flex;gap:10px;margin-top:10px}
.mp-btns .btn-primary{background:#009EE3}

/* ===== ERP ===== */
body.erp-on{background:#F2F3F5}
body.erp-on #nav,body.erp-on #footer{display:none}
.erp{display:grid;grid-template-columns:220px 1fr;min-height:100vh;font-size:14px}
@media(max-width:860px){.erp{grid-template-columns:minmax(0,1fr)}.erp-side,.erp-main{min-width:0}}
.erp-side{background:var(--ink);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}

.gl-adm{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:12px}
.gl-slot{display:flex;flex-direction:column;gap:8px}

.ck-chk a{color:var(--accent);font-weight:800;text-decoration:underline}
.ck-warn{background:var(--bg);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;color:#3A3C40;line-height:1.45}

.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border-radius:14px;padding:4px;margin:14px 0}

.cat-tabs button small{font-weight:700;opacity:.7;margin-left:4px}
.cat-tabs button small.ok{color:#1E7D46;opacity:1}

.cat-tabs button.on small.ok{color:#8FE0B0}
.cat-cnt{font-weight:700;color:var(--mute);font-size:13px;margin-left:6px}

<body>
<div id="app"></div>

<script>
/* ===== Min — Configurador de espacio (isométrico) =====
   Depende de globals: TONES, PRODUCTS, fmt, addToCart, showToast
   Uso: mountPlanner(elementoContenedor)                         */
(function () {
  const C = Math.cos(Math.PI / 6), SN = 0.5;   // proyección isométrica
  const SNAP = 0.05;                             // retícula de 5 cm
  const WALL_H = 1.1;                            // altura visual de muros
  const VB_W = 1000, VB_H = 620, PAD = 46;
  const STORE = 'min_plano_v1';

  const TYPES = {
    sofa:   { name: 'Sofá 2.40', sub: '3 plazas',  product: 'sofa' },
    sofa2:  { name: 'Sofá 2.00', sub: '2 plazas',  product: 'sofa2' },
    chaise: { name: 'Chaise', sub: 'con camastro', product: 'chaise', mirror: true },
    cama:   { name: 'Cama',   sub: '4 tamaños',    product: 'cama', sizes: true },
    sillon: { name: 'Sillón', sub: 'individual',   product: 'sillon' }
  };
  const ORDER = ['sofa', 'sofa2', 'chaise', 'cama', 'sillon'];
  const CAMA = { Individual: [1.00, 2.10], Matrimonial: [1.35, 2.10], Queen: [1.50, 2.10], King: [2.00, 2.10] };
  const SIZE_SHORT = { Individual: 'Ind', Matrimonial: 'Mat', Queen: 'Queen', King: 'King' };

  /* ---------- color ---------- */
  const h2r = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
  const r2h = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => { const x = h2r(a), y = h2r(b); return r2h(x.map((v, i) => v + (y[i] - v) * t)); };
  const lighten = (h, t) => mix(h, '#ffffff', t), darken = (h, t) => mix(h, '#000000', t);

  /* ---------- modelos (u = ancho, v = fondo, respaldo en v=0) ---------- */
  const B = (u0, u1, v0, v1, z0, z1, m) => ({ u0, u1, v0, v1, z0, z1, m });

  function model(type, size) {
    if (type === 'sofa' || type === 'sofa2') {
      const w = type === 'sofa' ? 2.40 : 2.00, d = 1.04, a = 0.2, bk = 0.24, mid = w / 2;
      return { w, d, parts: [
        B(.08, .14, .08, .14, 0, .1, 'l'), B(w - .14, w - .08, .08, .14, 0, .1, 'l'),
        B(.08, .14, d - .14, d - .08, 0, .1, 'l'), B(w - .14, w - .08, d - .14, d - .08, 0, .1, 'l'),
        B(0, w, 0, d, .1, .36, 'b'),
        B(0, w, 0, bk, .36, .8, 'b'),
        B(0, a, bk, d, .36, .62, 'b'), B(w - a, w, bk, d, .36, .62, 'b'),
        B(a, mid - .01, bk, d - .02, .36, .47, 'c'), B(mid + .01, w - a, bk, d - .02, .36, .47, 'c'),
        B(a, mid - .01, bk, bk + .17, .47, .74, 'c'), B(mid + .01, w - a, bk, bk + .17, .47, .74, 'c')
      ] };
    }
    if (type === 'chaise') {
      const w = 2.68, d = 1.68, sd = 1.04, cw = 0.9, a = 0.2, bk = 0.24;
      const c1 = 1.0, c2 = w - cw;
      return { w, d, parts: [
        B(.08, .14, .08, .14, 0, .1, 'l'), B(w - .14, w - .08, .08, .14, 0, .1, 'l'),
        B(.08, .14, sd - .14, sd - .08, 0, .1, 'l'), B(w - .14, w - .08, d - .14, d - .08, 0, .1, 'l'),
        B(c2 + .08, c2 + .14, d - .14, d - .08, 0, .1, 'l'),
        B(0, w, 0, sd, .1, .36, 'b'), B(c2, w, sd, d, .1, .36, 'b'),
        B(0, w, 0, bk, .36, .8, 'b'),
        B(0, a, bk, sd, .36, .62, 'b'), B(w - a, w, bk, d, .36, .62, 'b'),
        B(a, c1, bk, sd - .02, .36, .47, 'c'), B(c1 + .02, c2 - .01, bk, sd - .02, .36, .47, 'c'),
        B(c2 + .01, w - a, bk, d - .02, .36, .47, 'c'),
        B(a, c1, bk, bk + .17, .47, .74, 'c'), B(c1 + .02, c2 - .01, bk, bk + .17, .47, .74, 'c'),
        B(c2 + .01, w - a, bk, bk + .17, .47, .74, 'c')
      ] };
    }
    if (type === 'cama') {
      const [w, d] = CAMA[size] || CAMA.Matrimonial, hb = 0.15, cut = d * 0.42;
      const parts = [
        B(.06, .12, hb + .04, hb + .1, 0, .06, 'l'), B(w - .12, w - .06, hb + .04, hb + .1, 0, .06, 'l'),
        B(.06, .12, d - .12, d - .06, 0, .06, 'l'), B(w - .12, w - .06, d - .12, d - .06, 0, .06, 'l'),
        B(0, w, 0, hb, 0, 1.2, 'b'),
        B(0, w, hb, d, .06, .32, 'b'),
        B(.03, w - .03, hb + .01, cut, .32, .54, 'w'),
        B(.02, w - .02, cut, d - .02, .32, .6, 'q')
      ];
      if (w < 1.3) parts.push(B(.12, w - .12, hb + .06, hb + .42, .54, .66, 'p'));
      else parts.push(B(.12, w / 2 - .04, hb + .06, hb + .42, .54, .66, 'p'), B(w / 2 + .04, w - .12, hb + .06, hb + .42, .54, .66, 'p'));
      return { w, d, parts };
    }
    // sillón individual
    const w = .98, d = .92, a = .16, bk = .2;
    return { w, d, parts: [
      B(.07, .12, .07, .12, 0, .1, 'l'), B(w - .12, w - .07, .07, .12, 0, .1, 'l'),
      B(.07, .12, d - .12, d - .07, 0, .1, 'l'), B(w - .12, w - .07, d - .12, d - .07, 0, .1, 'l'),
      B(0, w, 0, d, .1, .36, 'b'),
      B(0, w, 0, bk, .36, .76, 'b'),
      B(0, a, bk, d, .36, .6, 'b'), B(w - a, w, bk, d, .36, .6, 'b'),
      B(a, w - a, bk, d - .02, .36, .47, 'c'),
      B(a, w - a, bk, bk + .15, .47, .68, 'c')
    ] };
  }

  const getModel = p => model(p.type, p.size);
  const dims = p => { const m = getModel(p); return p.rot % 2 ? [m.d, m.w] : [m.w, m.d]; };
  const pieceH = p => Math.max(...getModel(p).parts.map(b => b.z1));

  // local (u,v) -> mundo dentro de la caja girada
  function tf(m, rot, mir, u, v) {
    if (mir) u = m.w - u;
    switch (rot) {
      case 1: return [m.d - v, u];
      case 2: return [m.w - u, m.d - v];
      case 3: return [v, m.w - u];
      default: return [u, v];
    }
  }

  function worldBoxes(p) {
    const m = getModel(p);
    return m.parts.map(b => {
      const [ax, ay] = tf(m, p.rot, p.mir, b.u0, b.v0);
      const [bx, by] = tf(m, p.rot, p.mir, b.u1, b.v1);
      return withScreen({
        x0: p.x + Math.min(ax, bx), x1: p.x + Math.max(ax, bx),
        y0: p.y + Math.min(ay, by), y1: p.y + Math.max(ay, by),
        z0: b.z0, z1: b.z1, m: b.m
      });
    });
  }

  function withScreen(b) {
    b.sx0 = b.x0 - b.y1; b.sx1 = b.x1 - b.y0;
    b.sy0 = (b.x0 + b.y0) / 2 - b.z1; b.sy1 = (b.x1 + b.y1) / 2 - b.z0;
    return b;
  }

  // orden de pintado (atrás -> adelante) por separación en ejes
  function depthSort(bs) {
    const n = bs.length, E = 1e-6, adj = Array.from({ length: n }, () => []), indeg = new Array(n).fill(0);
    const key = b => b.x0 + b.x1 + b.y0 + b.y1 + b.z0 + b.z1;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = bs[i], b = bs[j];
      if (a.sx1 <= b.sx0 + E || b.sx1 <= a.sx0 + E || a.sy1 <= b.sy0 + E || b.sy1 <= a.sy0 + E) continue;
      const ab = a.x1 <= b.x0 + E || a.y1 <= b.y0 + E || a.z1 <= b.z0 + E;
      const ba = b.x1 <= a.x0 + E || b.y1 <= a.y0 + E || b.z1 <= a.z0 + E;
      let first = null;
      if (ab && !ba) first = i; else if (ba && !ab) first = j;
      else if (ab && ba) first = key(a) <= key(b) ? i : j;
      if (first === null) continue;
      const second = first === i ? j : i;
      adj[first].push(second); indeg[second]++;
    }
    const out = [], done = new Array(n).fill(false);
    while (out.length < n) {
      let pick = -1;
      for (let i = 0; i < n; i++) if (!done[i] && indeg[i] === 0 && (pick < 0 || key(bs[i]) < key(bs[pick]))) pick = i;
      if (pick < 0) { for (let i = 0; i < n; i++) if (!done[i] && (pick < 0 || key(bs[i]) < key(bs[pick]))) pick = i; }
      done[pick] = true; out.push(bs[pick]);
      adj[pick].forEach(k => indeg[k]--);
    }
    return out;
  }

  function matColor(m, tone) {
    switch (m) {
      case 'l': return '#3A302A';
      case 'w': return '#F4F4F2';
      case 'p': return '#FFFFFF';
      case 'q': return mix(tone, '#ffffff', 0.5);
      case 'c': return lighten(tone, 0.07);
      default: return tone;
    }
  }

  // redondea las esquinas de un polígono cualquiera (recorta cada vértice y lo une con una curva)
  function roundedPath(pts, r) {
    const n = pts.length;
    let d = '';
    for (let i = 0; i < n; i++) {
      const cur = pts[i], prev = pts[(i - 1 + n) % n], next = pts[(i + 1) % n];
      const tp = [prev[0] - cur[0], prev[1] - cur[1]], tn = [next[0] - cur[0], next[1] - cur[1]];
      const lp = Math.hypot(tp[0], tp[1]) || 1, ln = Math.hypot(tn[0], tn[1]) || 1;
      const rad = Math.min(r, lp * 0.42, ln * 0.42);
      const p1 = [cur[0] + tp[0] / lp * rad, cur[1] + tp[1] / lp * rad];
      const p2 = [cur[0] + tn[0] / ln * rad, cur[1] + tn[1] / ln * rad];
      d += (i === 0 ? 'M ' : 'L ') + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' ';
      d += 'Q ' + cur[0].toFixed(1) + ' ' + cur[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + ' ';
    }
    return d + 'Z';
  }

  function boxPolys(b, tone, P) {
    const base = matColor(b.m, tone), st = darken(base, 0.3);
    const proj = arr => arr.map(q => P(q[0], q[1], q[2]));
    const { x0, x1, y0, y1, z0, z1 } = b;
    const top = proj([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]]);
    const fx = proj([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]]);
    const fy = proj([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]);
    const sw = 'stroke="' + st + '" stroke-width="0.6" stroke-opacity="0.4" stroke-linejoin="round"';
    // radio suave, proporcional al tamaño de la pieza sobre pantalla (se autolimita en esquinas chicas)
    const edgeA = Math.hypot(top[1][0] - top[0][0], top[1][1] - top[0][1]);
    const edgeB = Math.hypot(top[3][0] - top[0][0], top[3][1] - top[0][1]);
    const r = Math.min(edgeA, edgeB) * 0.2;
    return `<path d="${roundedPath(fx, r)}" fill="${darken(base, 0.09)}" ${sw}/>` +
      `<path d="${roundedPath(fy, r)}" fill="${darken(base, 0.18)}" ${sw}/>` +
      `<path d="${roundedPath(top, r)}" fill="${lighten(base, 0.07)}" ${sw}/>`;
  }

  function pieceMarkup(p, P) {
    const tone = TONES[p.tone].c;
    return depthSort(worldBoxes(p)).map(b => boxPolys(b, tone, P)).join('');
  }

  function pieceAABB(p) {
    const [w, d] = dims(p);
    return withScreen({ x0: p.x, x1: p.x + w, y0: p.y, y1: p.y + d, z0: 0, z1: pieceH(p), p });
  }

  function priceOf(p) {
    const prod = PRODUCTS[TYPES[p.type].product];
    let pr = prod.price;
    if (p.type === 'cama' && prod.sizes) pr += prod.sizePriceDelta[prod.sizes.indexOf(p.size)] || 0;
    return pr;
  }

  function miniSVG(type, toneIdx) {
    const p = { type, x: 0, y: 0, rot: 0, mir: false, tone: toneIdx, size: 'Matrimonial' };
    const S = 30, P = (x, y, z) => [(x - y) * C * S, (x + y) * SN * S - z * S];
    const bs = worldBoxes(p);
    let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
    bs.forEach(b => [[b.x0, b.y0], [b.x1, b.y0], [b.x0, b.y1], [b.x1, b.y1]].forEach(([x, y]) => [b.z0, b.z1].forEach(z => {
      const [sx, sy] = P(x, y, z); mnx = Math.min(mnx, sx); mxx = Math.max(mxx, sx); mny = Math.min(mny, sy); mxy = Math.max(mxy, sy);
    })));
    const pd = 3;
    return `<svg viewBox="${(mnx - pd).toFixed(1)} ${(mny - pd).toFixed(1)} ${(mxx - mnx + pd * 2).toFixed(1)} ${(mxy - mny + pd * 2).toFixed(1)}" aria-hidden="true">${pieceMarkup(p, P)}</svg>`;
  }

  const ICON = {
    rot: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
    mir: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/></svg>',
    dup: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
    del: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    x: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  /* ================================================================ */
  window.mountPlanner = function (root) {
    let L = 4.10, A = 3.20, pieces = [], sel = null, uid = 1, active = false;
    let drag = null, pend = null, V = null;

    // estado guardado
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (s && Array.isArray(s.pieces)) {
        L = s.L || L; A = s.A || A;
        pieces = s.pieces.filter(p => TYPES[p.type]);
        pieces.forEach(p => { p.id = uid++; });
      }
    } catch (e) {}
    if (!pieces.length) {
      pieces = [
        { id: uid++, type: 'sofa', x: 0.9, y: 0, rot: 0, mir: false, tone: 3, size: 'Matrimonial' },
        { id: uid++, type: 'sillon', x: 3.05, y: 1.3, rot: 1, mir: false, tone: 1, size: 'Matrimonial' }
      ];
    }
    const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ L, A, pieces: pieces.map(({ id, ...r }) => r) })); } catch (e) {} };

    root.innerHTML = `
    <div class="pl">
      <div class="pl-head">
        <div>
          <span class="pill" style="letter-spacing:.06em">NUEVO</span>
          <h2>¿Cabe?<br>Acomódalo aquí.</h2>
          <p>Pon las medidas de tu cuarto, arrastra los muebles, gíralos y prueba combinaciones. Antes de comprar, no después.</p>
        </div>
        <div class="pl-room">
          <label>Largo<span><input data-dim="L" type="number" step="0.05" min="2" max="9" inputmode="decimal"> m</span></label>
          <label>Ancho<span><input data-dim="A" type="number" step="0.05" min="2" max="9" inputmode="decimal"> m</span></label>
          <button class="pl-btn2" data-act="clear">Vaciar</button>
        </div>
      </div>
      <div class="pl-body">
        <div class="pl-palette">
          <div class="pl-pal-t">Toca o arrastra al cuarto</div>
          ${ORDER.map(t => {
            const prod = PRODUCTS[TYPES[t].product], m = model(t, 'Matrimonial');
            return `<button class="pl-card" data-type="${t}" type="button">
              ${miniSVG(t, prod.defaultTone)}
              <span class="t"><b>${TYPES[t].name}</b><small>${m.w.toFixed(2)} × ${m.d.toFixed(2)} m</small><em>${fmt(prod.price)}</em></span>
              <span class="plus">${ICON.plus}</span>
            </button>`;
          }).join('')}
        </div>
        <div class="pl-stage">
          <svg class="pl-svg" viewBox="0 0 ${VB_W} ${VB_H}" role="img" aria-label="Plano isométrico de tu cuarto"></svg>
          <div class="pl-tb" hidden></div>
          <div class="pl-warn" hidden></div>
          <div class="pl-hint">Arrastra para mover · <kbd>R</kbd> girar · <kbd>Supr</kbd> quitar</div>
        </div>
      </div>
      <div class="pl-sum"></div>
    </div>`;

    const svg = root.querySelector('.pl-svg');
    const stage = root.querySelector('.pl-stage');
    const tb = root.querySelector('.pl-tb');
    const warnEl = root.querySelector('.pl-warn');
    const sumEl = root.querySelector('.pl-sum');
    const inL = root.querySelector('[data-dim="L"]'), inA = root.querySelector('[data-dim="A"]');
    inL.value = L.toFixed(2); inA.value = A.toFixed(2);

    /* ---------- geometría ---------- */
    const snap = v => Math.round(v / SNAP) * SNAP;
    const r3 = v => Math.round(v * 1000) / 1000;
    function clampPiece(p) {
      const [w, d] = dims(p);
      p.x = r3(Math.min(Math.max(0, snap(p.x)), Math.max(0, L - w)));
      p.y = r3(Math.min(Math.max(0, snap(p.y)), Math.max(0, A - d)));
    }
    function overlap(a, b) {
      const [aw, ad] = dims(a), [bw, bd] = dims(b), t = 0.01;
      return a.x < b.x + bw - t && b.x < a.x + aw - t && a.y < b.y + bd - t && b.y < a.y + ad - t;
    }
    const fits = p => { const [w, d] = dims(p); return w <= L + 1e-6 && d <= A + 1e-6; };

    function findFree(p, prefX, prefY) {
      const [w, d] = dims(p);
      const cx = prefX ?? (L - w) / 2, cy = prefY ?? (A - d) / 2;
      const cands = [];
      for (let x = 0; x <= Math.max(0, L - w) + 1e-6; x += 0.1)
        for (let y = 0; y <= Math.max(0, A - d) + 1e-6; y += 0.1)
          cands.push([x, y, (x - cx) ** 2 + (y - cy) ** 2]);
      cands.sort((a, b) => a[2] - b[2]);
      for (const [x, y] of cands) {
        const t = { ...p, x, y };
        if (!pieces.some(o => o.id !== p.id && overlap(t, o))) { p.x = x; p.y = y; clampPiece(p); return true; }
      }
      p.x = cx; p.y = cy; clampPiece(p); return false;
    }

    function computeView() {
      const PAD = svg.clientWidth && svg.clientWidth < 600 ? 14 : 46;
      const M = 0.62, L2 = L + M, A2 = A + M;   // margen al frente para las cotas
      const S = Math.min((VB_W - PAD * 2) / ((L2 + A2) * C), (VB_H - PAD * 2) / ((L2 + A2) * SN + WALL_H));
      const isoW = (L2 + A2) * C * S, isoH = ((L2 + A2) * SN + WALL_H) * S;
      return { S, ox: (VB_W - isoW) / 2 + A2 * C * S, oy: (VB_H - isoH) / 2 + WALL_H * S };
    }
    const P = (x, y, z) => [V.ox + (x - y) * C * V.S, V.oy + (x + y) * SN * V.S - z * V.S];
    const pts = arr => arr.map(q => P(q[0], q[1], q[2]).map(n => n.toFixed(1)).join(',')).join(' ');

    function clientToWorld(cx, cy) {
      const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      const a = (q.x - V.ox) / (C * V.S), b = (q.y - V.oy) / (SN * V.S);
      return { x: (a + b) / 2, y: (b - a) / 2 };
    }

    /* ---------- dibujo ---------- */
    function roomMarkup(showDims) {
      const T = 0.1, H = WALL_H, F = 0.08;
      let s = '';
      // muros (atrás)
      s += `<polygon points="${pts([[-T, -T, H], [L, -T, H], [L, 0, H], [0, 0, H], [0, A, H], [-T, A, H]])}" fill="#E4E7EA"/>`;
      s += `<polygon points="${pts([[0, 0, 0], [L, 0, 0], [L, 0, H], [0, 0, H]])}" fill="#FAFBFC" stroke="#DADEE2" stroke-width="1"/>`;
      s += `<polygon points="${pts([[0, 0, 0], [0, A, 0], [0, A, H], [0, 0, H]])}" fill="#F2F4F6" stroke="#DADEE2" stroke-width="1"/>`;
      s += `<polygon points="${pts([[L, -T, 0], [L, 0, 0], [L, 0, H], [L, -T, H]])}" fill="#D5D9DE"/>`;
      s += `<polygon points="${pts([[-T, A, 0], [0, A, 0], [0, A, H], [-T, A, H]])}" fill="#C9CED4"/>`;
      // zoclo
      s += `<polygon points="${pts([[0, 0, 0], [L, 0, 0], [L, 0, .08], [0, 0, .08]])}" fill="#EDEFF2"/>`;
      s += `<polygon points="${pts([[0, 0, 0], [0, A, 0], [0, A, .08], [0, 0, .08]])}" fill="#E6E9EC"/>`;
      // losa del piso (cantos frontales)
      s += `<polygon points="${pts([[L, 0, -F], [L, A, -F], [L, A, 0], [L, 0, 0]])}" fill="#D3D8DD"/>`;
      s += `<polygon points="${pts([[0, A, -F], [L, A, -F], [L, A, 0], [0, A, 0]])}" fill="#C4CAD0"/>`;
      // piso
      s += `<polygon class="pl-floor" points="${pts([[0, 0, 0], [L, 0, 0], [L, A, 0], [0, A, 0]])}" fill="#F0F2F4"/>`;
      for (let x = 0.5; x < L - 1e-6; x += 0.5) s += `<polyline points="${pts([[x, 0, 0], [x, A, 0]])}" stroke="#E1E5E9" stroke-width="1" fill="none"/>`;
      for (let y = 0.5; y < A - 1e-6; y += 0.5) s += `<polyline points="${pts([[0, y, 0], [L, y, 0]])}" stroke="#E1E5E9" stroke-width="1" fill="none"/>`;
      // cotas del cuarto (se ocultan cuando hay mueble seleccionado)
      if (!showDims) return s;
      const [lx, ly] = P(L / 2, A + 0.34, -F), [ax, ay] = P(L + 0.34, A / 2, -F);
      s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" transform="rotate(30 ${lx.toFixed(1)} ${ly.toFixed(1)})" class="pl-dim">${L.toFixed(2)} m</text>`;
      s += `<text x="${ax.toFixed(1)}" y="${ay.toFixed(1)}" transform="rotate(-30 ${ax.toFixed(1)} ${ay.toFixed(1)})" class="pl-dim">${A.toFixed(2)} m</text>`;
      return s;
    }

    // cotas encadenadas: pared | mueble | pared, en largo y en ancho
    function cotasMarkup(p) {
      const [w, d] = dims(p), x0 = p.x, x1 = p.x + w, y0 = p.y, y1 = p.y + d, tk = 0.07;
      const yl = A + 0.3, xl = L + 0.3;   // cotas por fuera de los muros
      const col = { dim: '#161513', gap: '#C9663D' };
      const f = n => n.toFixed(1);
      const ln = (a, b, c, wd, dash) => `<polyline points="${pts([a, b])}" stroke="${c}" stroke-width="${wd}" fill="none"${dash ? ' stroke-dasharray="3 3"' : ''} stroke-linecap="round"/>`;
      const label = (q, rot, txt, kind, anchor) => {
        const [lx, ly] = P(q[0], q[1], 0);
        return `<text x="${f(lx)}" y="${f(ly)}" dy="${anchor === 'in' ? -6 : 17}" transform="rotate(${rot} ${f(lx)} ${f(ly)})" class="pl-cota ${kind}">${txt}</text>`;
      };
      // tramos cortos: el número se va afuera, pasando el extremo de la pared
      const place = (a, b) => [(a + b) / 2, b - a < 0.45 ? 'in' : null];   // tramo corto: número del lado de adentro
      const txt = v => v.toFixed(2) + ' m';
      let s = '<g class="pl-cotas">';
      // líneas de extensión desde las esquinas del mueble
      s += ln([x0, y1, 0], [x0, yl + tk, 0], '#8A867E', 1, true) + ln([x1, y1, 0], [x1, yl + tk, 0], '#8A867E', 1, true);
      s += ln([x1, y0, 0], [xl + tk, y0, 0], '#8A867E', 1, true) + ln([x1, y1, 0], [xl + tk, y1, 0], '#8A867E', 1, true);
      // cadena en X (largo)
      [[0, x0, 'gap'], [x0, x1, 'dim'], [x1, L, 'gap']].forEach(([a, b, k]) => {
        if (b - a < 0.005) return;
        s += ln([a, yl, 0], [b, yl, 0], col[k], k === 'dim' ? 2 : 1.6);
        s += ln([a, yl - tk, 0], [a, yl + tk, 0], col[k], 1.6) + ln([b, yl - tk, 0], [b, yl + tk, 0], col[k], 1.6);
        const [m, an] = place(a, b);
        s += label([m, yl], 30, txt(b - a), k, an);
      });
      // cadena en Y (ancho)
      [[0, y0, 'gap'], [y0, y1, 'dim'], [y1, A, 'gap']].forEach(([a, b, k]) => {
        if (b - a < 0.005) return;
        s += ln([xl, a, 0], [xl, b, 0], col[k], k === 'dim' ? 2 : 1.6);
        s += ln([xl - tk, a, 0], [xl + tk, a, 0], col[k], 1.6) + ln([xl - tk, b, 0], [xl + tk, b, 0], col[k], 1.6);
        const [m, an] = place(a, b);
        s += label([xl, m], -30, txt(b - a), k, an);
      });
      return s + '</g>';
    }

    function conflicts() {
      const hit = new Set(), msgs = [];
      for (let i = 0; i < pieces.length; i++) {
        const a = pieces[i];
        if (!fits(a)) { hit.add(a.id); msgs.push(`${TYPES[a.type].name} no cabe en ${L.toFixed(2)} × ${A.toFixed(2)} m`); }
        for (let j = i + 1; j < pieces.length; j++) if (overlap(a, pieces[j])) {
          hit.add(a.id); hit.add(pieces[j].id);
          msgs.push(`${TYPES[a.type].name} y ${TYPES[pieces[j].type].name} se enciman`);
        }
      }
      return { hit, msgs };
    }

    function render(full = true) {
      V = computeView();
      const { hit, msgs } = conflicts();
      let s = `<defs>
        <filter id="plSel" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="d"/><feFlood flood-color="#C9663D"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="plHit" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="d"/><feFlood flood-color="#D93025"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="plShadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>`;
      const selP = pieces.find(q => q.id === sel);
      const showCotas = !!(selP && fits(selP));
      s += roomMarkup(!showCotas);
      // sombras y huellas en el piso
      pieces.forEach(p => {
        const [w, d] = dims(p), e = 0.04, sh = 0.1;
        const isHit = hit.has(p.id), isSel = sel === p.id;
        s += `<g${isHit ? '' : ' filter="url(#plShadow)"'}><polygon points="${pts([[p.x - e - sh, p.y - e - sh, 0], [p.x + w + e + sh, p.y - e - sh, 0], [p.x + w + e + sh, p.y + d + e + sh, 0], [p.x - e - sh, p.y + d + e + sh, 0]])}" fill="${isHit ? 'rgba(217,48,37,.22)' : 'rgba(22,21,19,.16)'}"/></g>`;
        if (isSel || isHit) {
          const g = 0.09;
          s += `<polygon points="${pts([[p.x - g, p.y - g, 0], [p.x + w + g, p.y - g, 0], [p.x + w + g, p.y + d + g, 0], [p.x - g, p.y + d + g, 0]])}" fill="none" stroke="${isHit ? '#D93025' : '#C9663D'}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
        }
      });
      // muebles en orden de profundidad
      depthSort(pieces.map(pieceAABB)).forEach(bb => {
        const p = bb.p, isHit = hit.has(p.id), isSel = sel === p.id;
        const lift = drag && drag.id === p.id ? ' transform="translate(0,-7)"' : '';
        const f = isHit ? ' filter="url(#plHit)"' : isSel ? ' filter="url(#plSel)"' : '';
        s += `<g class="pc" data-pid="${p.id}"${lift}${f}>${pieceMarkup(p, P)}</g>`;
      });
      if (showCotas) s += cotasMarkup(selP);
      if (!pieces.length) {
        const [cx, cy] = P(L / 2, A / 2, 0);
        s += `<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" class="pl-empty" text-anchor="middle">Toca un mueble o arrástralo aquí</text>`;
      }
      svg.innerHTML = s;

      warnEl.hidden = !msgs.length;
      warnEl.textContent = msgs.length ? '⚠ ' + msgs[0] + (msgs.length > 1 ? ` (+${msgs.length - 1})` : '') : '';

      if (drag) tb.hidden = true; else placeToolbar();
      if (full) { renderSummary(hit); save(); }
    }

    function placeToolbar() {
      const p = pieces.find(q => q.id === sel);
      if (!p) { tb.hidden = true; return; }
      const [w, d] = dims(p), h = pieceH(p), t = TYPES[p.type];
      tb.innerHTML = `
        <div class="pl-tb-t"><b>${t.name}${p.type === 'cama' ? ' ' + p.size : ''}</b><span>${w.toFixed(2)} × ${d.toFixed(2)} m · ${fmt(priceOf(p))}</span></div>
        <div class="pl-tb-row">
          <button class="ic" data-act="rot" title="Girar 90° (R)" aria-label="Girar">${ICON.rot}</button>
          ${t.mirror ? `<button class="ic" data-act="mir" title="Voltear (F)" aria-label="Voltear">${ICON.mir}</button>` : ''}
          <span class="sep"></span>
          ${TONES.map((tn, j) => `<button class="sw ${j === p.tone ? 'sel' : ''}" data-tone="${j}" title="${tn.n}" aria-label="Tono ${tn.n}"><span style="background:${tn.c}"></span></button>`).join('')}
          ${t.sizes ? `<span class="sep"></span>` + Object.keys(CAMA).map(k => `<button class="sz ${k === p.size ? 'sel' : ''}" data-size="${k}" title="${k}">${SIZE_SHORT[k]}</button>`).join('') : ''}
          <span class="sep"></span>
          <button class="ic" data-act="dup" title="Duplicar (D)" aria-label="Duplicar">${ICON.dup}</button>
          <button class="ic del" data-act="del" title="Quitar (Supr)" aria-label="Quitar">${ICON.del}</button>
        </div>`;
      tb.hidden = false;
      const ctm = svg.getScreenCTM(), sr = stage.getBoundingClientRect();
      const toPx = ([x, y]) => [ctm.a * x + ctm.e - sr.left, ctm.d * y + ctm.f - sr.top];
      const corners = [[p.x, p.y], [p.x + w, p.y], [p.x, p.y + d], [p.x + w, p.y + d]];
      const topPts = corners.map(([x, y]) => toPx(P(x, y, h)));
      const botPts = corners.map(([x, y]) => toPx(P(x, y, 0)));
      const cx = (Math.min(...topPts.map(q => q[0])) + Math.max(...topPts.map(q => q[0]))) / 2;
      const top = Math.min(...topPts.map(q => q[1])), bot = Math.max(...botPts.map(q => q[1]));
      const tw = tb.offsetWidth, th = tb.offsetHeight;
      const below = top - th - 14 < 6;
      const x = Math.min(Math.max(cx, tw / 2 + 8), sr.width - tw / 2 - 8);
      tb.classList.toggle('below', below);
      tb.style.left = x + 'px';
      tb.style.top = (below ? Math.min(bot + 12, sr.height - th - 6) : top - 12) + 'px';
      tb.style.setProperty('--ax', (cx - x) + 'px');
    }

    function renderSummary(hit) {
      const total = pieces.reduce((s, p) => s + priceOf(p), 0);
      const area = pieces.reduce((s, p) => { const [w, d] = dims(p); return s + w * d; }, 0);
      const occ = Math.min(100, Math.round(area / (L * A) * 100));
      sumEl.innerHTML = `
        <div class="pl-list">
          ${pieces.length ? pieces.map(p => `
            <div class="pl-chip ${sel === p.id ? 'sel' : ''} ${hit.has(p.id) ? 'hit' : ''}" data-pick="${p.id}" role="button" tabindex="0">
              <i style="background:${TONES[p.tone].c}"></i>${TYPES[p.type].name}${p.type === 'cama' ? ' ' + SIZE_SHORT[p.size] : ''} · ${TONES[p.tone].n}
              <button data-rm="${p.id}" aria-label="Quitar">${ICON.x}</button>
            </div>`).join('') : '<span class="pl-none">Tu cuarto está vacío.</span>'}
        </div>
        <div class="pl-stats">
          <div class="pl-stat"><small>Piso ocupado</small><b>${occ}%</b></div>
          <div class="pl-stat"><small>Total</small><b>${fmt(total)}</b></div>
          <button class="btn-primary pl-cart" data-act="cart" ${pieces.length ? '' : 'disabled'}>Agregar todo al carrito</button>
        </div>
        ${total > 0 ? `<div class="pl-msi">${mesesBoxHTML(total)}</div>` : ''}`;
    }

    /* ---------- acciones ---------- */
    const byId = id => pieces.find(p => p.id === id);
    function keepCenter(p, fn) {
      const [w0, d0] = dims(p), cx = p.x + w0 / 2, cy = p.y + d0 / 2;
      fn();
      const [w1, d1] = dims(p); p.x = cx - w1 / 2; p.y = cy - d1 / 2; clampPiece(p);
    }
    function addPiece(type, at) {
      const prod = PRODUCTS[TYPES[type].product];
      const p = { id: uid++, type, x: 0, y: 0, rot: 0, mir: false, tone: prod.defaultTone, size: 'Matrimonial' };
      if (at) { const [w, d] = dims(p); p.x = at.x - w / 2; p.y = at.y - d / 2; clampPiece(p); }
      else findFree(p);
      pieces.push(p); sel = p.id; active = true; render();
    }
    function act(a) {
      const p = byId(sel);
      if (a === 'clear') { pieces = []; sel = null; render(); return; }
      if (a === 'cart') {
        if (!pieces.length) return;
        pieces.forEach(q => addToCart(TYPES[q.type].product, q.tone, q.type === 'cama' ? q.size : null, 1));
        showToast(pieces.length === 1 ? '1 mueble agregado al carrito' : pieces.length + ' muebles agregados al carrito');
        return;
      }
      if (!p) return;
      if (a === 'rot') keepCenter(p, () => { p.rot = (p.rot + 1) % 4; });
      if (a === 'mir') p.mir = !p.mir;
      if (a === 'dup') {
        const c = { ...p, id: uid++ };
        c.x = p.x + 0.25; c.y = p.y + 0.25; clampPiece(c);
        if (pieces.some(o => overlap(c, o))) findFree(c, p.x, p.y);
        pieces.push(c); sel = c.id;
      }
      if (a === 'del') { pieces = pieces.filter(q => q.id !== p.id); sel = null; }
      render();
    }

    /* ---------- eventos: cuarto ---------- */
    svg.addEventListener('pointerdown', e => {
      active = true;
      const g = e.target.closest('[data-pid]');
      if (!g) { if (sel !== null) { sel = null; render(); } return; }
      const p = byId(+g.dataset.pid); if (!p) return;
      e.preventDefault();
      sel = p.id;
      const w0 = clientToWorld(e.clientX, e.clientY);
      drag = { id: p.id, pid: e.pointerId, gx: w0.x, gy: w0.y, px: p.x, py: p.y, moved: false };
      svg.setPointerCapture(e.pointerId);
      svg.classList.add('dragging');
      render(false);
    });
    svg.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.pid) return;
      const p = byId(drag.id); if (!p) return;
      const w = clientToWorld(e.clientX, e.clientY);
      const nx = drag.px + (w.x - drag.gx), ny = drag.py + (w.y - drag.gy);
      const ox = p.x, oy = p.y;
      p.x = nx; p.y = ny; clampPiece(p);
      if (p.x !== ox || p.y !== oy) { drag.moved = true; render(false); }
    });
    const endDrag = e => {
      if (!drag || (e && e.pointerId !== drag.pid)) return;
      drag = null; svg.classList.remove('dragging'); render();
    };
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
    svg.addEventListener('dblclick', e => { if (e.target.closest('[data-pid]')) act('rot'); });

    /* ---------- eventos: paleta (clic o arrastrar) ---------- */
    let ghost = null;
    root.querySelector('.pl-palette').addEventListener('pointerdown', e => {
      const card = e.target.closest('.pl-card'); if (!card) return;
      pend = { type: card.dataset.type, x: e.clientX, y: e.clientY, pid: e.pointerId, dragging: false, touch: e.pointerType === 'touch' };
    });
    function onWinMove(e) {
      if (!pend || e.pointerId !== pend.pid) return;
      if (!pend.dragging) {
        if (pend.touch || Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < 6) return;
        pend.dragging = true;
        ghost = document.createElement('div');
        ghost.className = 'pl-ghost';
        ghost.innerHTML = miniSVG(pend.type, PRODUCTS[TYPES[pend.type].product].defaultTone);
        document.body.appendChild(ghost);
      }
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
      const r = svg.getBoundingClientRect();
      ghost.classList.toggle('in', e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom);
    }
    function onWinUp(e) {
      if (!pend || e.pointerId !== pend.pid) return;
      const p = pend; pend = null;
      if (ghost) { ghost.remove(); ghost = null; }
      if (!p.dragging) {
        if (Math.hypot(e.clientX - p.x, e.clientY - p.y) > 10) return;
        const card = document.elementFromPoint(e.clientX, e.clientY);
        if (card && card.closest && card.closest('.pl-card')) addPiece(p.type);
        return;
      }
      const r = svg.getBoundingClientRect();
      if (e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) {
        addPiece(p.type, clientToWorld(e.clientX, e.clientY));
      }
    }
    window.addEventListener('pointermove', onWinMove);
    window.addEventListener('pointerup', onWinUp);
    function onWinCancel() { pend = null; if (ghost) { ghost.remove(); ghost = null; } }
    window.addEventListener('pointercancel', onWinCancel);

    /* ---------- eventos: toolbar, resumen, medidas ---------- */
    tb.addEventListener('pointerdown', e => e.stopPropagation());
    tb.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const p = byId(sel); if (!p) return;
      if (b.dataset.act) return act(b.dataset.act);
      if (b.dataset.tone) { p.tone = +b.dataset.tone; render(); }
      if (b.dataset.size) { keepCenter(p, () => { p.size = b.dataset.size; }); render(); }
    });
    sumEl.addEventListener('click', e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { pieces = pieces.filter(q => q.id !== +rm.dataset.rm); if (sel === +rm.dataset.rm) sel = null; render(); return; }
      const pk = e.target.closest('[data-pick]');
      if (pk) { sel = +pk.dataset.pick; active = true; render(); return; }
      const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act);
    });
    root.querySelector('[data-act="clear"]').addEventListener('click', () => act('clear'));
    function applyDims() {
      const nl = Math.min(9, Math.max(2, parseFloat(inL.value) || L));
      const na = Math.min(9, Math.max(2, parseFloat(inA.value) || A));
      L = r3(nl); A = r3(na);
      pieces.forEach(clampPiece);
      render();
    }
    [inL, inA].forEach(inp => {
      inp.addEventListener('change', () => { applyDims(); inp.value = (inp === inL ? L : A).toFixed(2); });
      inp.addEventListener('input', () => { const v = parseFloat(inp.value); if (v >= 2 && v <= 9) applyDims(); });
    });

    /* ---------- teclado ---------- */
    function onKey(e) {
      if (!root.isConnected) return cleanup();
      if (!active || sel === null) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey) return;
      const p = byId(sel); if (!p) return;
      const step = e.shiftKey ? 0.25 : SNAP;
      const k = e.key;
      if (k === 'r' || k === 'R') act('rot');
      else if (k === 'f' || k === 'F') { if (TYPES[p.type].mirror) act('mir'); }
      else if (k === 'd' || k === 'D') act('dup');
      else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); act('del'); }
      else if (k === 'Escape') { sel = null; render(); }
      else if (k.startsWith('Arrow')) {
        e.preventDefault();
        if (k === 'ArrowLeft') p.x -= step; if (k === 'ArrowRight') p.x += step;
        if (k === 'ArrowUp') p.y -= step; if (k === 'ArrowDown') p.y += step;
        clampPiece(p); render();
      }
    }
    function onDocDown(e) { if (!root.contains(e.target)) active = false; }
    function onResize() { if (!root.isConnected) return cleanup(); if (!drag) placeToolbar(); }
    function cleanup() {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onDocDown);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('pointermove', onWinMove);
      window.removeEventListener('pointerup', onWinUp);
      window.removeEventListener('pointercancel', onWinCancel);
    }
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onDocDown);
    window.addEventListener('resize', onResize);

    render();
    return { cleanup };
  };
})();

</script>

<script>
/* ===== Min ERP + checkout con Mercado Pago =====
   Depende de: PRODUCTS, TONES, fmt, getCart, saveCart, updateCartBadge, MinFlete
   Pedidos: en Supabase, vía /api (sesión de administrador con cookie firmada por el servidor).
   El checkout crea el pedido y la preferencia en /api/checkout y abre el pago real de Mercado Pago.
   localStorage solo guarda ajustes del panel (correos) y cambios de los pedidos demo. */
(function () {
  const CFG = 'min_erp_cfg';
  const API = (path, opts) => fetch(path, Object.assign({ credentials: 'include' }, opts || {}));
  const apiJ = async (path, opts) => { const r = await API(path, opts); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; };
  let SRV = null, SESS = {};                    // pedidos del servidor (null = sin cargar) y estado de conexiones
  const DIAS_FAB = 21;

  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const cfg = () => Object.assign({ taller: 'taller@casamin.mx', avisos: 'infominmx@gmail.com', demo: false }, ls.get(CFG, {}));
  const setCfg = c => ls.set(CFG, Object.assign(cfg(), c));

  const ESTADOS = {
    pagado:     { t: 'Por producir',   c: '#C9663D' },
    produccion: { t: 'En producción',  c: '#8A6D1F' },
    listo:      { t: 'Listo p/ envío', c: '#2F5D8A' },
    enviado:    { t: 'Enviado',        c: '#5B4B8A' },
    entregado:  { t: 'Entregado',      c: '#3F6B34' },
    cancelado:  { t: 'Cancelado',      c: '#8A8F96' },
    pendiente:  { t: 'Pago pendiente', c: '#8A8F96' }
  };
  const FLUJO = ['pagado', 'produccion', 'listo', 'enviado', 'entregado'];
  const PAGO = { aprobado: 'Aprobado', pendiente: 'Pendiente', rechazado: 'Rechazado' };
  const ZONAS = ['CDMX', 'Área metropolitana', 'Puebla'];

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const d0 = t => new Date(t);
  const fdate = t => t ? d0(t).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
  const fshort = t => t ? d0(t).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }) : '—';
  const addDays = (t, n) => t + n * 864e5;
  const toneOf = n => TONES.find(t => t.n === n) || { c: '#ccc', n };
  const catOf = it => it.cat || (TONES.find(t => t.n === it.tone) || {}).cat || 'Beloved';
  const tela = it => `Catálogo ${catOf(it)} · Tono ${it.tone}`;
  const piezas = it => it.qty * (it.id === 'chaise' ? 2 : 1);
  const LG = () => (window.MinLegal && MinLegal.LEGAL) || { pisosSinElevador: 3, version: 's/v' };
  const accesoTxt = c => [c.acceso, c.piso].filter(Boolean).join(' · ');

  function medidas(it) {
    const p = PRODUCTS[it.id]; if (!p) return '';
    const rows = (p.hasSize ? p.dimsBySize[it.size || p.sizes[1]] : p.dims) || [];
    return rows.slice(0, 3).map(r => r[1].replace(/ \(.*\)/, '')).join(' × ');
  }

  /* ---------------- datos ---------------- */
  function real() { return SRV || []; }

  let DEMO = null;
  function demo() {
    if (DEMO) return DEMO;
    let s = 20260925; const r = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const pick = a => a[Math.floor(r() * a.length)];
    const nombres = ['Ana Pérez', 'Carlos Méndez', 'Valeria Ruiz', 'Diego Torres', 'Sofía Navarro', 'Emilio Castro', 'Renata Díaz', 'Mateo Herrera', 'Paula Vega', 'Iván Rojas', 'Camila Soto', 'Andrés Luna', 'Mariana Gil', 'Tomás Ortega', 'Lucía Ramos', 'Pablo Serrano', 'Fernanda Cruz', 'Jorge Molina', 'Daniela Paz', 'Santiago Ríos', 'Regina León', 'Hugo Fuentes', 'Ximena Mora', 'Rodrigo Salas', 'Natalia Ibarra', 'Leonardo Campos'];
    const calles = ['Av. Álvaro Obregón 120', 'Tonalá 45', 'Amsterdam 210', 'Insurgentes Sur 1450', 'Av. Juárez 88', 'Calle 5 de Mayo 31', 'Blvd. Atlixcáyotl 2301', 'Av. Reforma 505', 'Tamaulipas 150', 'Av. Universidad 900'];
    const ids = ['sofa', 'sofa', 'sofa2', 'sillon', 'sillon', 'chaise', 'cama', 'cama'];
    const now = Date.now(), out = [];
    for (let i = 0; i < 26; i++) {
      const age = Math.floor(Math.pow(r(), 1.3) * 110);
      const created = now - age * 864e5 - Math.floor(r() * 8) * 36e5;
      const n = r() < .7 ? 1 : (r() < .6 ? 2 : 3);
      const items = [];
      for (let k = 0; k < n; k++) {
        const id = pick(ids), p = PRODUCTS[id];
        const size = p.hasSize ? pick(['Individual', 'Matrimonial', 'Matrimonial', 'Queen', 'Queen', 'King']) : null;
        const tone = TONES[Math.floor(r() * 4)].n;

        items.push({ id, name: p.name, cat: 'Beloved', tone, size, qty: 1, unitPrice: unit });

      const fl = pz >= 4 ? 'gratis' : (r() < .7 ? 'ruta' : 'ya');
      const flc = { gratis: 0, ruta: 1000, ya: 3000 }[fl];
      const nom = nombres[i % nombres.length];
      const zona = r() < .62 ? 'CDMX' : (r() < .55 ? 'Área metropolitana' : 'Puebla');
      let estado = age > 34 ? 'entregado' : age > 27 ? 'enviado' : age > 21 ? 'listo' : age > 2 ? 'produccion' : 'pagado';
      let pago = 'aprobado';
      if (i === 3) { estado = 'pendiente'; pago = 'pendiente'; }
      if (i === 9 && age > 40) estado = 'cancelado';
      const o = {
        id: 'MIN-' + (1001 + i), demo: true, createdAt: created, paidAt: pago === 'aprobado' ? created + 6e5 : null,
        customer: { nombre: nom, email: nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(' ', '.') + '@gmail.com', tel: '55' + String(10000000 + Math.floor(r() * 89999999)), calle: pick(calles), ...(([c, p]) => ({ colonia: c, cp: p }))(pick({ 'CDMX': [['Roma Norte', '06700'], ['Condesa', '06140'], ['Narvarte', '03020'], ['Del Valle', '03100'], ['Juárez', '06600'], ['Polanco', '11560']], 'Área metropolitana': [['Satélite', '53100'], ['Interlomas', '52787'], ['Tecamachalco', '53950']], 'Puebla': [['Angelópolis', '72830'], ['La Paz', '72160'], ['Cholula', '72760']] }[zona])), zona, refs: '' },
        items, subtotal: sub, flete: { tipo: fl, costo: flc }, total: sub + flc,
        pago: { metodo: 'Mercado Pago', estado: pago, mpId: pago === 'aprobado' ? String(9e10 + Math.floor(r() * 1e9)) : null },
        estado, notas: '', envio: {}, produccion: {}
      };
      const idx = FLUJO.indexOf(estado);
      if (idx >= 1) o.produccion = { enviadaAt: o.paidAt + 864e5, op: 'OP-' + o.id.slice(4) };
      if (idx >= 2) o.produccion.terminadaAt = addDays(o.paidAt, DIAS_FAB - 1);
      if (idx >= 3) o.envio = { fecha: addDays(o.paidAt, DIAS_FAB + 3), nota: fl === 'ya' ? 'Camioneta exclusiva' : 'Ruta ' + zona };
      if (idx >= 4) o.envio.entregadoAt = addDays(o.envio.fecha, 1);
      out.push(o);
    }
    return (DEMO = out);
  }
  const demoEdits = () => ls.get('min_erp_demo_edits', {});
  function all() {
    const ed = demoEdits();
    const d = cfg().demo ? demo().map(o => Object.assign({}, o, ed[o.id] || {})) : [];
    return real().concat(d).sort((a, b) => b.createdAt - a.createdAt);
  }
  function update(id, patch) {
    const rs = real(), o = rs.find(x => x.id === id);
    if (o) {
      Object.assign(o, patch);
      const body = {}; ['estado', 'notas', 'envio', 'produccion'].forEach(k => { if (patch[k] !== undefined) body[k] = patch[k]; });
      if (Object.keys(body).length) apiJ('/api/admin/orders?id=' + encodeURIComponent(id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .catch(e => toast('No se guardó el cambio: ' + e.message + '. Recarga la página.'));
      return;
    }
    const ed = demoEdits(); ed[id] = Object.assign(ed[id] || {}, patch); ls.set('min_erp_demo_edits', ed);
  }
  const get = id => all().find(o => o.id === id);

  /* ---------------- correos (mailto) ---------------- */
  function mailto(to, subject, body) { return 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body); }
  function lineasTxt(o) {
    return o.items.map(it => `• ${it.qty} × ${it.name}${it.size ? ' ' + it.size : ''} — ${tela(it)} — ${medidas(it)}`).join('\n');
  }
  function correoTaller(list) {
    const body = 'Hola, van las siguientes órdenes de producción de Min:\n\n' + list.map(o =>
      `${o.produccion.op || 'OP-' + o.id.slice(4)} (pedido ${o.id}) — compromiso ${fdate(addDays(o.paidAt || o.createdAt, DIAS_FAB))}\n${lineasTxt(o)}${o.notas ? '\nNotas: ' + o.notas : ''}`
    ).join('\n\n') + '\n\nGracias.\nMin · Casa Min S.A. de C.V.';
    return mailto(cfg().taller, `Órdenes de producción Min (${list.length}) — ${fshort(Date.now())}`, body);
  }
  function correoCliente(o) {
    const n = o.customer.nombre.split(' ')[0];
    const msgs = {
      pagado: `¡Gracias por tu compra! Ya recibimos tu pago y tu pedido ${o.id} entra a fabricación. Tarda 3 semanas; te avisamos en cuanto esté listo.`,
      produccion: `Tu pedido ${o.id} ya se está fabricando. Fecha estimada de término: ${fdate(addDays(o.paidAt || o.createdAt, DIAS_FAB))}.`,
      listo: `¡Tu pedido ${o.id} está terminado! Te contactamos para confirmar el día de entrega.`,
      enviado: `Tu pedido ${o.id} va en camino${o.envio && o.envio.fecha ? ', llega el ' + fdate(o.envio.fecha) : ''}. Incluye subida por elevador y armado.`,
      entregado: `¡Esperamos que disfrutes tus muebles! Si algo no está bien, responde este correo.`
    };
    const body = `Hola ${n},\n\n${msgs[o.estado] || ''}\n\nTu pedido:\n${lineasTxt(o)}\n\nTotal: ${fmt(o.total)}\n\n— Equipo Min`;
    return mailto(o.customer.email, `Tu pedido ${o.id} · Min`, body);
  }

  /* ---------------- CHECKOUT (cliente) ---------------- */
  function openCheckout() {

    const flK = MinFlete.fleteActual(), flC = MinFlete.fleteCosto();
    const sub = cart.reduce((a, b) => a + b.qty * b.unitPrice, 0);
    const ov = document.createElement('div');
    ov.className = 'ck-ov';
    ov.innerHTML = `
      <div class="ck">

        <div class="ck-step" data-s="1">
          <h2>¿A dónde te lo llevamos?</h2>

            </div>

            <button class="btn-primary w2 ck-mp" type="submit"><span class="mp-logo">mercado<b>pago</b></span> Pagar ${fmt(sub + flC)}</button>
            <p class="ck-err w2" data-err hidden></p>

    document.body.appendChild(ov);

  /* ---------------- ERP ---------------- */
  const ICON = {
    home: '<path d="M4 11l8-7 8 7v9H4z"/>', box: '<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
    tool: '<path d="M14 6a4 4 0 0 0 5 5l-9 9-3-3 9-9a4 4 0 0 0-2-2z"/>', truck: '<path d="M3 6h11v10H3zM14 9h4l3 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 4 6"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
