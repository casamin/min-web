    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', img: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>', print: '<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/>', out: '<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>'
  };
  const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
  const badge = e => `<span class="eb" style="--c:${(ESTADOS[e] || {}).c}">${(ESTADOS[e] || { t: e }).t}</span>`;
  const pagoB = p => `<span class="pb ${p}">${PAGO[p] || p}</span>`;

  let view = 'resumen', period = 30, fEstado = 'todos', q = '', sel = new Set();

  async function cargar(root) {
    document.body.classList.add('erp-on');
    root.innerHTML = '<div class="erp-login"><form><div class="erp-logo">min.<span>ERP</span></div><p class="muted sm">Cargando…</p></form></div>';
    try { SESS = await apiJ('/api/admin/session'); } catch (e) { SESS = {}; }
    if (!SESS.admin) return login(root);
    try { SRV = await apiJ('/api/admin/orders'); }
    catch (e) { SRV = []; setTimeout(() => toast('No se pudieron cargar los pedidos: ' + e.message), 50); }
    mount(root);
  }
  function mount(root) {
    if (SRV === null) return cargar(root);
    document.body.classList.add('erp-on');
    root.innerHTML = `
      <div class="erp">
        <aside class="erp-side">
          <div class="erp-logo">min.<span>ERP</span></div>
          <nav>${[['resumen', 'home', 'Resumen'], ['pedidos', 'box', 'Pedidos'], ['produccion', 'tool', 'Producción'], ['envios', 'truck', 'Envíos'], ['clientes', 'users', 'Clientes'], ['catalogo', 'grid', 'Catálogo'], ['galeria', 'img', 'Galería'], ['ajustes', 'gear', 'Ajustes']]
            .map(([k, i, t]) => `<button data-v="${k}" class="${view === k ? 'on' : ''}">${ic(i)}<span>${t}</span></button>`).join('')}</nav>
          <div class="erp-side-f">
            <a href="${location.pathname.endsWith('erp.html') ? 'index.html' : '#/'}">Ver tienda</a>
            <button data-logout>${ic('out')}Salir</button>
          </div>
        </aside>
        <main class="erp-main" id="erpMain"></main>
        <div class="erp-drawer" id="erpDrawer" hidden></div>
      </div>`;
    root.querySelectorAll('.erp-side nav button').forEach(b => b.onclick = () => { view = b.dataset.v; sel.clear(); SRV = null; mount(root); });
    root.querySelector('[data-logout]').onclick = async () => { await API('/api/admin/logout', { method: 'POST' }).catch(() => {}); SRV = null; document.body.classList.remove('erp-on'); location.hash = '#/'; };
    const main = root.querySelector('#erpMain');
    ({ resumen, pedidos, produccion, envios, clientes, catalogo, galeria, ajustes })[view](main, root);

  function login(root) {
    document.body.classList.add('erp-on');
    root.innerHTML = `
      <div class="erp-login">
        <form>
          <div class="erp-logo">min.<span>ERP</span></div>
          <label>Contraseña<input type="password" name="p" autofocus autocomplete="current-password"></label>
          <button class="btn-primary">Entrar</button>
          <small class="err" hidden>Contraseña incorrecta</small>
          <a href="${location.pathname.endsWith('erp.html') ? 'index.html' : '#/'}">← Volver a la tienda</a>
        </form>
      </div>`;
    root.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const er = root.querySelector('.err'); er.hidden = true;
      try {
        await apiJ('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: e.target.p.value }) });
        SRV = null; mount(root);
      } catch (x) { er.textContent = /incorrecta/i.test(x.message) ? 'Contraseña incorrecta' : 'No se pudo entrar: ' + x.message; er.hidden = false; }
    };
  }

  const head = (t, sub, right) => `<header class="erp-h"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right || ''}</header>`;
  const paid = o => o.pago.estado === 'aprobado' && o.estado !== 'cancelado';

  /* ---- Resumen ---- */
  function resumen(main, root) {
    const now = Date.now(), from = period ? now - period * 864e5 : 0;
    const os = all().filter(o => paid(o) && o.createdAt >= from);
    const ventas = os.reduce((a, o) => a + o.subtotal, 0);
    const flete = os.reduce((a, o) => a + o.flete.costo, 0);
    const pz = os.reduce((a, o) => a + o.items.reduce((x, i) => x + piezas(i), 0), 0);
    const A = all();
    const cnt = e => A.filter(o => o.estado === e && o.pago.estado === 'aprobado').length;
    const tarde = A.filter(o => o.estado === 'produccion' && now > addDays(o.paidAt, DIAS_FAB)).length;

    // semanas
    const W = 12, wk = Array.from({ length: W }, (_, i) => ({ start: now - (W - i) * 7 * 864e5, v: 0, n: 0 }));
    all().filter(paid).forEach(o => { const i = Math.floor((o.createdAt - (now - W * 7 * 864e5)) / (7 * 864e5)); if (i >= 0 && i < W) { wk[i].v += o.subtotal; wk[i].n++; } });
    const maxW = Math.max(1, ...wk.map(w => w.v));

    const byP = {}, byT = {}, byZ = {}, byF = { ruta: 0, ya: 0, gratis: 0 };
    os.forEach(o => {
      o.items.forEach(i => { const k = i.name + (i.size ? ' ' + i.size : ''); byP[i.name] = byP[i.name] || { n: 0, v: 0 }; byP[i.name].n += i.qty; byP[i.name].v += i.qty * i.unitPrice; byT[i.tone] = (byT[i.tone] || 0) + i.qty; });
      byZ[o.customer.zona] = (byZ[o.customer.zona] || 0) + 1; byF[o.flete.tipo]++;
    });
    const prods = Object.entries(byP).sort((a, b) => b[1].v - a[1].v), maxP = Math.max(1, ...prods.map(p => p[1].v));
    const tones = TONES.map(t => [t, byT[t.n] || 0]), maxT = Math.max(1, ...tones.map(t => t[1]));

    main.innerHTML = head('Resumen', 'Ventas pagadas vía Mercado Pago', `
      <div class="seg">${[[7, '7 días'], [30, '30 días'], [90, '90 días'], [0, 'Todo']].map(([v, t]) => `<button data-p="${v}" class="${period === v ? 'on' : ''}">${t}</button>`).join('')}</div>`) + `
      <section class="kpis">
        <div class="kpi kpi-hero"><small>Ventas</small><b>${fmt(ventas)}</b><span>${os.length} pedidos · ticket ${fmt(os.length ? Math.round(ventas / os.length) : 0)}</span></div>
        <div class="kpi"><small>Piezas vendidas</small><b>${pz}</b></div>
        <div class="kpi"><small>Flete cobrado</small><b>${fmt(flete)}</b></div>
        <div class="kpi go" data-go="produccion"><small>Por mandar a producción</small><b>${cnt('pagado')}</b><span>${cnt('produccion')} en taller${tarde ? ` · <em>${tarde} atrasado${tarde > 1 ? 's' : ''}</em>` : ''}</span></div>
        <div class="kpi go" data-go="envios"><small>Listos para envío</small><b>${cnt('listo')}</b><span>${cnt('enviado')} en camino</span></div>
      </section>
      <section class="erp-grid">
        <div class="panel span2">
          <h3>Ventas por semana <small>últimas 12 semanas</small></h3>
          <div class="bars">${wk.map(w => `<div class="bar" data-tip="${fshort(w.start)} → ${fshort(w.start + 6 * 864e5)}: ${fmt(w.v)} · ${w.n} pedido${w.n === 1 ? '' : 's'}"><i style="height:${Math.max(w.v ? 3 : 0, w.v / maxW * 100)}%"></i><span>${fshort(w.start).replace('.', '')}</span></div>`).join('')}</div>
        </div>
        <div class="panel">
          <h3>Productos <small>por venta</small></h3>
          ${prods.length ? prods.map(([n, d]) => `<div class="hb" data-tip="${esc(n)}: ${d.n} pzas · ${fmt(d.v)}"><span>${esc(n)}</span><div><i style="width:${d.v / maxP * 100}%"></i></div><b>${fmt(d.v)}</b></div>`).join('') : '<p class="muted">Sin ventas en el periodo.</p>'}
        </div>
        <div class="panel">
          <h3>Telas más pedidas <small>catálogo · tono</small></h3>
          ${tones.map(([t, n]) => `<div class="hb tone" data-tip="${t.n}: ${n} pzas"><span><i class="sw" style="background:${t.c}"></i>${t.cat} · ${t.n}</span><div><i style="width:${n / maxT * 100}%"></i></div><b>${n}</b></div>`).join('')}
        </div>
        <div class="panel">
          <h3>Flete elegido</h3>
          <div class="mini3">${[['ruta', 'Ruta Min'], ['ya', 'Lo quiero YA'], ['gratis', 'Gratis 4+']].map(([k, t]) => `<div><b>${byF[k]}</b><small>${t}</small></div>`).join('')}</div>
          <h3 style="margin-top:18px">Zona</h3>
          <div class="mini3">${ZONAS.map(z => `<div><b>${byZ[z] || 0}</b><small>${z}</small></div>`).join('')}</div>
        </div>
        <div class="panel">
          <h3>Pedidos por estado</h3>
          ${['pendiente', 'pagado', 'produccion', 'listo', 'enviado', 'entregado', 'cancelado'].map(e => `<div class="erp-pl">${badge(e)}<b>${A.filter(o => o.estado === e).length}</b></div>`).join('')}
        </div>
        <div class="panel span3">
          <h3>Últimos pedidos <button class="lnk" data-go="pedidos">Ver todos →</button></h3>
          ${tabla(all().slice(0, 6), false)}
        </div>
      </section>`;
    main.querySelectorAll('.seg button').forEach(b => b.onclick = () => { period = +b.dataset.p; resumen(main, root); });
    main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { view = b.dataset.go; mount(root); });
    bindRows(main, root); tips(main);
  }

  function tabla(list, check) {
    if (!list.length) return '<p class="muted">No hay pedidos.</p>';
    return `<div class="tw"><table class="tbl"><thead><tr>${check ? '<th></th>' : ''}<th>Folio</th><th>Fecha</th><th>Cliente</th><th>Qué</th><th>Catálogo · Tono</th><th>Flete</th><th class="r">Total</th><th>Pago</th><th>Estado</th></tr></thead><tbody>
      ${list.map(o => `<tr data-id="${o.id}">${check ? `<td><input type="checkbox" data-sel="${o.id}" ${sel.has(o.id) ? 'checked' : ''}></td>` : ''}
        <td class="mono">${o.id}${o.demo ? '<i class="demo">demo</i>' : ''}</td><td>${fshort(o.createdAt)}</td>
        <td><b>${esc(o.customer.nombre)}</b><small>${esc(o.customer.zona)}</small></td>
        <td>${o.items.map(i => `${i.qty > 1 ? i.qty + '× ' : ''}${esc(i.name)}${i.size ? ' <small class="inl">' + i.size + '</small>' : ''}`).join('<br>')}</td>
        <td>${o.items.map(i => `<span class="tn"><i style="background:${toneOf(i.tone).c}"></i><span><small class="cat">${catOf(i)}</small>${i.tone}</span></span>`).join('<br>')}</td>
        <td>${MinFlete.FLETE[o.flete.tipo].name}</td>
        <td class="r mono">${fmt(o.total)}</td><td>${pagoB(o.pago.estado)}</td><td>${badge(o.estado)}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  function bindRows(main, root) {
    main.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', e => { if (e.target.closest('input')) return; drawer(root, tr.dataset.id); }));
  }

  /* ---- Pedidos ---- */
  function pedidos(main, root) {
    const A = all();
    const cuenta = e => e === 'todos' ? A.length : A.filter(o => o.estado === e).length;
    let list = fEstado === 'todos' ? A : A.filter(o => o.estado === fEstado);
    if (q) { const s = q.toLowerCase(); list = list.filter(o => (o.id + ' ' + o.customer.nombre + ' ' + o.customer.email + ' ' + o.customer.tel + ' ' + o.items.map(i => i.name + ' ' + catOf(i) + ' ' + i.tone).join(' ')).toLowerCase().includes(s)); }
    main.innerHTML = head('Pedidos', 'Quién compró, cuándo, qué y con qué tela', `<button class="btn-secondary sm" data-csv>Exportar CSV</button>`) + `
      <div class="filters">
        <div class="erp-chips">${['todos', 'pendiente', 'pagado', 'produccion', 'listo', 'enviado', 'entregado', 'cancelado'].map(e => `<button data-e="${e}" class="${fEstado === e ? 'on' : ''}">${e === 'todos' ? 'Todos' : ESTADOS[e].t}<small>${cuenta(e)}</small></button>`).join('')}</div>
        <input class="search" placeholder="Buscar folio, cliente, tela…" value="${esc(q)}">
      </div>
      <div class="panel">${tabla(list, false)}</div>`;
    main.querySelectorAll(".erp-chips button").forEach(b => b.onclick = () => { fEstado = b.dataset.e; pedidos(main, root); });
    const s = main.querySelector('.search');
    s.oninput = () => { q = s.value; const pos = s.selectionStart; pedidos(main, root); const n = main.querySelector('.search'); n.focus(); n.setSelectionRange(pos, pos); };
    main.querySelector('[data-csv]').onclick = csv;
    bindRows(main, root);
  }

  /* ---- Producción ---- */
  function produccion(main, root) {
    const now = Date.now(), A = all().filter(o => o.pago.estado === 'aprobado');
    const por = A.filter(o => o.estado === 'pagado'), en = A.filter(o => o.estado === 'produccion');
    const card = (o, check) => {
      const comp = addDays(o.paidAt, DIAS_FAB), dias = Math.ceil((comp - now) / 864e5);
      return `<div class="op ${dias < 0 && !check ? 'late' : ''}" data-id="${o.id}">
        <div class="op-h">${check ? `<input type="checkbox" data-sel="${o.id}" ${sel.has(o.id) ? 'checked' : ''}>` : ''}<b class="mono">${o.produccion.op || 'OP-' + o.id.slice(4)}</b><span>${o.id} · ${esc(o.customer.nombre)}</span>
          <span class="op-d">${check ? 'Pagado ' + fshort(o.paidAt) : (dias >= 0 ? `Entrega a taller en <b>${dias}</b> días` : `<b>${-dias}</b> días de atraso`)}</span></div>
        <table class="op-t"><tbody>${o.items.map(i => `<tr><td><b>${i.qty} × ${esc(i.name)}</b>${i.size ? ' ' + i.size : ''}</td><td><span class="tn"><i style="background:${toneOf(i.tone).c}"></i>${tela(i)}</span></td><td class="mono">${medidas(i)}</td><td>${i.id === 'sofa' || i.id === 'sofa2' || i.id === 'chaise' ? '2 piezas (elevador)' : '1 pieza'}</td></tr>`).join('')}</tbody></table>
        <div class="op-f">Compromiso: <b>${fdate(comp)}</b>${o.notas ? ' · Notas: ' + esc(o.notas) : ''}
          <span><button class="lnk" data-print="${o.id}">${ic('print')}Imprimir</button>${check ? '' : `<button class="lnk" data-listo="${o.id}">Marcar terminado →</button>`}</span></div>
      </div>`;
    };
    main.innerHTML = head('Producción', `Órdenes para el taller · fabricación ${DIAS_FAB} días`, `<span class="muted sm">Taller: ${esc(cfg().taller)}</span>`) + `
      <div class="panel">
        <h3>Por mandar a fabricar <small>${por.length}</small>
          <span class="acts"><button class="lnk" data-all>Seleccionar todo</button><a class="btn-primary sm ${sel.size ? '' : 'dis'}" data-send href="#">${ic('mail')}Enviar ${sel.size || ''} al taller por correo</a></span></h3>
        ${por.length ? por.map(o => card(o, true)).join('') : '<p class="muted">Nada pendiente. 🎉</p>'}
      </div>
      <div class="panel">
        <h3>En el taller <small>${en.length}</small></h3>
        ${en.length ? en.sort((a, b) => a.paidAt - b.paidAt).map(o => card(o, false)).join('') : '<p class="muted">Nada en fabricación.</p>'}
      </div>`;
    main.querySelectorAll('[data-sel]').forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.sel) : sel.delete(c.dataset.sel); produccion(main, root); });
    main.querySelector('[data-all]').onclick = () => { por.forEach(o => sel.add(o.id)); produccion(main, root); };
    const send = main.querySelector('[data-send]');
    const chosen = por.filter(o => sel.has(o.id));
    if (chosen.length) send.href = correoTaller(chosen.map(o => Object.assign({}, o, { produccion: { op: 'OP-' + o.id.slice(4) } })));
    send.onclick = e => {
      if (!chosen.length) { e.preventDefault(); return; }
      chosen.forEach(o => update(o.id, { estado: 'produccion', produccion: { op: 'OP-' + o.id.slice(4), enviadaAt: Date.now() } }));
      sel.clear(); setTimeout(() => produccion(main, root), 50);
    };
    main.querySelectorAll('[data-print]').forEach(b => b.onclick = e => { e.stopPropagation(); imprimirOP(get(b.dataset.print)); });
    main.querySelectorAll('[data-listo]').forEach(b => b.onclick = e => { e.stopPropagation(); update(b.dataset.listo, { estado: 'listo', produccion: Object.assign({}, get(b.dataset.listo).produccion, { terminadaAt: Date.now() }) }); produccion(main, root); });
    main.querySelectorAll('.op').forEach(c => c.addEventListener('click', e => { if (e.target.closest('input,button,a')) return; drawer(root, c.dataset.id); }));
  }

  function imprimirOP(o) {
    const w = window.open('', '_blank'); if (!w) return;
    w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${o.produccion.op || 'OP-' + o.id.slice(4)}</title>
      <style>body{font-family:system-ui,sans-serif;padding:32px;color:#161513}h1{margin:0;font-size:28px}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{border:1px solid #ccc;padding:10px;text-align:left;font-size:14px}.m{color:#666;font-size:13px}.box{display:inline-block;width:14px;height:14px;border:1px solid #999;vertical-align:middle;margin-right:6px}</style></head><body>
      <h1>Orden de producción ${o.produccion.op || 'OP-' + o.id.slice(4)}</h1>
      <p class="m">Min · Casa Min S.A. de C.V. — Pedido ${o.id} — Pagado ${fdate(o.paidAt)} — <b>Compromiso ${fdate(addDays(o.paidAt, DIAS_FAB))}</b></p>
      <table><tr><th>Cant.</th><th>Pieza</th><th>Tamaño</th><th>Catálogo</th><th>Tono</th><th>Medidas</th><th>Empaque</th><th>OK</th></tr>
      ${o.items.map(i => `<tr><td>${i.qty}</td><td>${i.name}</td><td>${i.size || '—'}</td><td>${catOf(i)}</td><td>${i.tone}</td><td>${medidas(i)}</td><td>${['sofa', 'sofa2', 'chaise'].includes(i.id) ? '2 piezas (elevador)' : '1 pieza'}</td><td><span class="box"></span></td></tr>`).join('')}</table>
      <p><b>Entrega:</b> ${o.customer.zona} · ${MinFlete.FLETE[o.flete.tipo].name}${accesoTxt(o.customer) ? ' · ' + esc(accesoTxt(o.customer)) : ''}</p>${o.notas ? `<p><b>Notas:</b> ${esc(o.notas)}</p>` : ''}
      <p class="m" style="margin-top:40px">Recibe taller: ____________________ &nbsp; Fecha: __________</p>
      <script>print()<\/script></body></html>`);
    w.document.close();
  }

  /* ---- Envíos ---- */
  function envios(main, root) {
    const A = all().filter(o => o.pago.estado === 'aprobado');
    const listos = A.filter(o => o.estado === 'listo'), env = A.filter(o => o.estado === 'enviado'), ent = A.filter(o => o.estado === 'entregado').slice(0, 8);
    const card = o => `<div class="ec" data-id="${o.id}"><div><b>${esc(o.customer.nombre)}</b><span class="mono">${o.id}</span></div>
      <small>${esc(o.customer.colonia)}, ${esc(o.customer.zona)} · CP ${esc(o.customer.cp)}${accesoTxt(o.customer) ? ' · ' + esc(accesoTxt(o.customer)) : ''}</small>
      <small>${o.items.map(i => i.name + (i.size ? ' ' + i.size : '')).join(', ')} · <b>${(n => n + (n === 1 ? ' pza' : ' pzas'))(o.items.reduce((a, i) => a + piezas(i), 0))}</b></small>
      <div class="ec-f"><span class="ft ${o.flete.tipo}">${MinFlete.FLETE[o.flete.tipo].name}</span>${o.envio && o.envio.fecha ? `<span>${fshort(o.envio.fecha)}</span>` : ''}</div></div>`;
    const grupos = {};
    listos.forEach(o => { const k = o.flete.tipo === 'ya' ? 'Lo quiero YA · camioneta exclusiva' : 'Ruta Min · ' + o.customer.zona; (grupos[k] = grupos[k] || []).push(o); });
    main.innerHTML = head('Envíos', 'Cuándo sale y cuándo llega cada pedido') + `
      <div class="kanban">
        <div class="kcol"><h3>Listos para envío <small>${listos.length}</small></h3>
          ${Object.keys(grupos).length ? Object.entries(grupos).map(([k, l]) => `<div class="kg"><h4>${k} <small>${l.reduce((a, o) => a + o.items.reduce((x, i) => x + piezas(i), 0), 0)} pzas</small></h4>${l.map(card).join('')}</div>`).join('') : '<p class="muted">Nada listo todavía.</p>'}</div>
        <div class="kcol"><h3>En camino <small>${env.length}</small></h3>${env.map(card).join('') || '<p class="muted">—</p>'}</div>
        <div class="kcol"><h3>Entregados <small>recientes</small></h3>${ent.map(card).join('') || '<p class="muted">—</p>'}</div>
      </div>`;
    main.querySelectorAll('.ec').forEach(c => c.onclick = () => drawer(root, c.dataset.id));
  }

  /* ---- Clientes ---- */
  function clientes(main, root) {
    const m = {};
    all().filter(o => o.pago.estado === 'aprobado').forEach(o => {
      const k = o.customer.email; const c = m[k] = m[k] || { c: o.customer, n: 0, v: 0, last: 0 };
      c.n++; c.v += o.total; c.last = Math.max(c.last, o.createdAt);
    });
    const list = Object.values(m).sort((a, b) => b.last - a.last);
    main.innerHTML = head('Clientes', `${list.length} clientes con pago aprobado`) + `
      <div class="panel"><div class="tw"><table class="tbl"><thead><tr><th>Nombre</th><th>Contacto</th><th>Zona</th><th class="r">Pedidos</th><th class="r">Total</th><th>Último</th></tr></thead><tbody>
      ${list.map(c => `<tr><td><b>${esc(c.c.nombre)}</b></td><td><a href="mailto:${esc(c.c.email)}">${esc(c.c.email)}</a><small><a href="https://wa.me/52${esc(c.c.tel)}" target="_blank" rel="noopener">WhatsApp ${esc(c.c.tel)}</a></small></td><td>${esc(c.c.zona)}</td><td class="r">${c.n}</td><td class="r mono">${fmt(c.v)}</td><td>${fshort(c.last)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  /* ---- Galería (página Nuestra fábrica) ---- */
  function galeria(main) {
    if (!window.MinGaleria) { main.innerHTML = head('Galería', 'Módulo no cargado'); return; }
    MinGaleria.admin(main, head, toast);
  }

  /* ---- Catálogo (fotos reales de producto: sofá, sillón, chaise, cama) ---- */
  function catalogo(main) {
    if (!window.MinCatalogo) { main.innerHTML = head('Catálogo', 'Módulo no cargado'); return; }
    MinCatalogo.admin(main, head, toast);
  }

  /* ---- Ajustes ---- */
  function ajustes(main, root) {
    const c = cfg();
    main.innerHTML = head('Ajustes') + `
      <div class="erp-grid">
        <div class="panel"><h3>Correos</h3>
          <label class="fld">Correo del taller (órdenes de producción)<input data-k="taller" value="${esc(c.taller)}"></label>
          <label class="fld">Correo de avisos de venta<input data-k="avisos" value="${esc(c.avisos)}"></label>
          <button class="btn-primary sm" data-save>Guardar</button></div>
        <div class="panel"><h3>Mercado Pago</h3>
          ${SESS.mp ? '<p class="st"><span class="dot ok"></span><b>Conectado</b> — cuenta Casa Min. Los pagos llegan con el folio MIN-… como referencia.</p>'
            : '<p class="st"><span class="dot warn"></span><b>Sin conectar</b> — falta la variable MP_ACCESS_TOKEN en Vercel. Mientras tanto la tienda no puede cobrar.</p>'}
          <p class="muted sm">El pedido se crea en el servidor con los precios oficiales y Mercado Pago avisa cuando se paga. La llave nunca va en la página.</p>
          ${SESS.mail ? '' : '<p class="muted sm">Correos automáticos al cliente: sin configurar (se usan los botones de correo de cada pedido).</p>'}</div>
        <div class="panel"><h3>Datos</h3>
          <label class="tg"><input type="checkbox" data-demo ${c.demo ? 'checked' : ''}> Mostrar pedidos demo (${demo().length})</label>
          <p class="muted sm">${real().length} pedido(s) reales guardados en el servidor.</p>
          <div class="row"><button class="btn-secondary sm" data-csv>Exportar CSV</button><button class="btn-secondary sm" data-reset>Borrar cambios de demo</button></div></div>
      </div>`;
    main.querySelector('[data-save]').onclick = () => { const o = {}; main.querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.value.trim()); setCfg(o); toast('Guardado'); };
    main.querySelector('[data-demo]').onchange = e => { setCfg({ demo: e.target.checked }); ajustes(main, root); };
    main.querySelector('[data-csv]').onclick = csv;
    main.querySelector('[data-reset]').onclick = () => { ls.set('min_erp_demo_edits', {}); toast('Listo'); };
  }

  /* ---- Detalle ---- */
  function drawer(root, id) {
    const o = get(id); if (!o) return;
    const dw = root.querySelector('#erpDrawer'); dw.hidden = false;
    const i = FLUJO.indexOf(o.estado);
    const fechas = [o.paidAt, o.produccion && o.produccion.enviadaAt, o.produccion && o.produccion.terminadaAt, o.envio && o.envio.fecha, o.envio && o.envio.entregadoAt];
    const accion = {
      pagado: ['Mandar a producción', 'produccion'], produccion: ['Marcar terminado', 'listo'],
      listo: ['Registrar envío', 'enviado'], enviado: ['Marcar entregado', 'entregado']
    }[o.estado];
    dw.innerHTML = `
      <div class="dw-bg"></div>
      <div class="dw">
        <div class="dw-h"><div><span class="mono">${o.id}</span>${o.demo ? '<i class="demo">demo</i>' : ''}<h2>${esc(o.customer.nombre)}</h2><small>Pedido ${fdate(o.createdAt)}</small></div><button class="dw-x">×</button></div>
        <div class="dw-b">
          <div class="steps5">${FLUJO.map((e, k) => `<div class="${k <= i ? 'on' : ''} ${k === i ? 'cur' : ''}"><i></i><b>${ESTADOS[e].t}</b><small>${k <= i && fechas[k] ? fshort(fechas[k]) : ''}</small></div>`).join('')}</div>
          ${o.estado === 'cancelado' || o.estado === 'pendiente' ? `<p>${badge(o.estado)} ${pagoB(o.pago.estado)}</p>` : ''}
          <section><h4>Cliente</h4>
            <p><a href="mailto:${esc(o.customer.email)}">${esc(o.customer.email)}</a> · <a href="https://wa.me/52${esc(o.customer.tel)}" target="_blank" rel="noopener">WhatsApp ${esc(o.customer.tel)}</a></p>
            <p>${esc(o.customer.calle)}, ${esc(o.customer.colonia)}, CP ${esc(o.customer.cp)} · <b>${esc(o.customer.zona)}</b></p>${accesoTxt(o.customer) ? `<p><b>Acceso:</b> ${esc(accesoTxt(o.customer))}</p>` : ''}${o.customer.refs ? `<p class="muted">${esc(o.customer.refs)}</p>` : ''}${o.customer.aceptacion ? `<p class="muted sm">✓ Aceptó términos y política de accesos (v${esc(o.customer.aceptacion.version)}) · ${fdate(o.customer.aceptacion.at)}</p>` : ''}</section>
          <section><h4>Productos</h4>
            ${o.items.map(it => `<div class="dl"><span class="tn"><i style="background:${toneOf(it.tone).c}"></i></span><div><b>${it.qty} × ${esc(it.name)}${it.size ? ' ' + it.size : ''}</b><small>${tela(it)} · ${medidas(it)}</small></div><span class="mono">${fmt(it.qty * it.unitPrice)}</span></div>`).join('')}
            <div class="dl t"><span></span><div>Flete · ${MinFlete.FLETE[o.flete.tipo].name}</div><span class="mono">${o.flete.costo ? fmt(o.flete.costo) : 'Gratis'}</span></div>
            <div class="dl t"><span></span><div><b>Total</b></div><span class="mono"><b>${fmt(o.total)}</b></span></div></section>
          <section><h4>Pago</h4><p>${o.pago.metodo} · ${pagoB(o.pago.estado)}${o.pago.mpId ? ` · <span class="mono">#${o.pago.mpId}</span>` : ''}</p></section>
          ${o.estado === 'listo' ? `<section><h4>Envío</h4><div class="row"><label class="fld">Fecha de entrega<input type="date" data-fecha value="${new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10)}"></label><label class="fld">Ruta / chofer<input data-ruta placeholder="Ej. Ruta CDMX jueves"></label></div></section>` : ''}
          ${o.envio && o.envio.fecha ? `<section><h4>Envío</h4><p>${fdate(o.envio.fecha)}${o.envio.nota ? ' · ' + esc(o.envio.nota) : ''}</p></section>` : ''}
          <section><h4>Notas internas</h4><textarea data-notas rows="2" placeholder="Ej. cliente pide entrega en la tarde">${esc(o.notas)}</textarea></section>
        </div>
        <div class="dw-f">
          ${accion && o.pago.estado === 'aprobado' ? `<button class="btn-primary" data-next="${accion[1]}">${accion[0]}</button>` : ''}
          <a class="btn-secondary" href="${correoCliente(o)}">${ic('mail')}Correo al cliente</a>
          ${o.estado === 'pagado' || o.estado === 'produccion' ? `<button class="lnk" data-print>${ic('print')}Orden de producción</button>` : ''}
          ${o.estado !== 'cancelado' && o.estado !== 'entregado' ? `<button class="lnk danger" data-cancel>Cancelar</button>` : ''}
        </div>
      </div>`;
    const close = () => { dw.hidden = true; mount(root); };
    dw.querySelector('.dw-x').onclick = close; dw.querySelector('.dw-bg').onclick = close;
    dw.querySelector('[data-notas]').onchange = e => update(o.id, { notas: e.target.value });
    const nx = dw.querySelector('[data-next]');
    if (nx) nx.onclick = () => {
      const e = nx.dataset.next, p = {};
      if (e === 'produccion') { p.produccion = { op: 'OP-' + o.id.slice(4), enviadaAt: Date.now() }; location.href = correoTaller([Object.assign({}, o, p)]); }
      if (e === 'listo') p.produccion = Object.assign({}, o.produccion, { terminadaAt: Date.now() });
      if (e === 'enviado') { const f = dw.querySelector('[data-fecha]').value; p.envio = { fecha: f ? new Date(f + 'T12:00').getTime() : Date.now(), nota: dw.querySelector('[data-ruta]').value }; }
      if (e === 'entregado') p.envio = Object.assign({}, o.envio, { entregadoAt: Date.now() });
      update(o.id, Object.assign(p, { estado: e })); drawer(root, o.id);
    };
    const pr = dw.querySelector('[data-print]'); if (pr) pr.onclick = () => imprimirOP(o);
    const cc = dw.querySelector('[data-cancel]'); if (cc) cc.onclick = () => { if (confirm('¿Cancelar el pedido ' + o.id + '?')) { update(o.id, { estado: 'cancelado' }); drawer(root, o.id); } };
  }

  /* ---- util ---- */
  function csv() {
    const rows = [['folio', 'fecha', 'cliente', 'correo', 'tel', 'zona', 'cp', 'producto', 'tamano', 'catalogo', 'tono', 'cant', 'precio', 'flete', 'flete_costo', 'total_pedido', 'pago', 'estado']];
    all().forEach(o => o.items.forEach(i => rows.push([o.id, new Date(o.createdAt).toISOString().slice(0, 10), o.customer.nombre, o.customer.email, o.customer.tel, o.customer.zona, o.customer.cp, i.name, i.size || '', catOf(i), i.tone, i.qty, i.unitPrice, o.flete.tipo, o.flete.costo, o.total, o.pago.estado, o.estado])));
    const blob = new Blob(['﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'min-pedidos.csv'; a.click();
  }
  function toast(m) { if (window.showToast) showToast(m); }
  function tips(main) {
    let tip = document.querySelector('.erp-tip');
    if (!tip) { tip = document.createElement('div'); tip.className = 'erp-tip'; document.body.appendChild(tip); }
    main.querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mousemove', e => { tip.textContent = el.dataset.tip; tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY - 34 + 'px'; });
      el.addEventListener('mouseleave', () => tip.style.display = 'none');
    });
  }

  window.MinERP = { mount, openCheckout, all };
})();

</script>
<script>

   Marco: LFPC (arts. 7 bis, 56, 77, 81, 90, 92 bis/ter) y LFPDPPP (DOF 20-mar-2025).
   Nada aquí renuncia a derechos del consumidor: las cláusulas que lo hacen son nulas y exponen a la empresa. */
(function () {
  const LEGAL = {
    empresa: 'Casa Min S.A. de C.V.',
    marca: 'Min',
    rfc: 'CMI210129QN2',
    domicilio: 'Privada de Horacio 22, Polanco, CDMX, C.P. 11500',
    correo: 'infominmx@gmail.com',          // CONFIRMAR: correo de atención de Min
    whatsapp: '',                            // CONFIRMAR: 10 dígitos, ej. '2221234567'
    horario: 'lunes a viernes de 9:00 a 18:00 h',

    garantiaTapiz: 6,                        // meses
    revocacion: 5,                           // días hábiles (LFPC art. 56) — no se puede reducir
    reembolso: 10,                           // días hábiles para reembolsar tras recibir el mueble
    pisosSinElevador: 3,                     // pisos por escalera incluidos en el flete
    espera: 30,                              // minutos de tolerancia en domicilio
    tolerancia: '±2 cm',
    version: '2026-09-26',
    actualizado: '26 de septiembre de 2026'
  };
  const L = LEGAL;
  const wa = () => L.whatsapp ? `WhatsApp ${L.whatsapp.replace(/(\d{2,3})(\d{3,4})(\d{4})$/, '$1 $2 $3')}` : 'WhatsApp [por confirmar]';
  const waHref = () => L.whatsapp ? `https://wa.me/52${L.whatsapp}` : '#';
  const contacto = () => `<a href="mailto:${L.correo}">${L.correo}</a> o ${wa()}, ${L.horario}`;
  const link = (doc, t) => `<a href="#/legal?doc=${doc}">${t}</a>`;
  const fleteTxt = () => {
    const F = (window.MinFlete && MinFlete.FLETE) || {};
    const p = k => F[k] ? `$${F[k].price.toLocaleString('es-MX')}` : '';
    return `<li><b>Lo quiero YA</b> ${p('ya')} — camioneta exclusiva para tu pedido.</li>
      <li><b>Ruta Min</b> ${p('ruta')} — tu pedido viaja en nuestra ruta programada por zona.</li>
      <li><b>Flete gratis</b> desde 4 piezas en el mismo pedido (el Chaise cuenta como 2 piezas).</li>`;
  };

  const DOCS = {
    terminos: {
      s: 'Términos y condiciones',
      t: 'Términos y condiciones',
      body: () => `

   en producción: Supabase Storage), 2) archivos en assets/galeria/<slot>.jpg empaquetados al construir.
   Si no hay foto, se muestra el espacio vacío con su etiqueta. */
(function () {
  const KEY = 'min_galeria';
  const SECCIONES = [
    { id: 'fabrica', n: '01', t: 'La fábrica', sub: 'Aquí nace cada mueble Min, en el mismo taller donde llevamos 20 años fabricando para las tiendas grandes.',
      slots: [['fab-1', 'El taller', 'Nuestra planta de producción.'], ['fab-2', 'El equipo', 'Las manos detrás de tu mueble.'], ['fab-3', 'Área de tapizado', 'Donde la tela toma forma.']] },
    { id: 'proceso', n: '02', t: 'Así se hace', sub: 'Seis pasos. Sin atajos. Transparencia es todo para nosotros.',
      slots: [['pro-1', 'Corte de madera', 'Cortamos las piezas de la estructura a medida.'], ['pro-2', 'Estructura', 'Armamos y reforzamos el esqueleto del mueble.'],
              ['pro-3', 'Espuma', 'Colocamos espuma de alta densidad por capas.'], ['pro-4', 'Corte de tela', 'Cortamos la tela pieza por pieza.'],
              ['pro-5', 'Tapizado', 'Tensamos, engrapamos y cosemos a mano.'], ['pro-6', 'Revisión final', 'Cada mueble se revisa antes de salir.']] },
    { id: 'materiales', n: '03', t: 'Materiales', sub: 'Lo que no se ve es lo que hace que dure.',
      slots: [['mat-1', 'Madera de pino tratada', 'La estructura.'], ['mat-2', 'Espuma de alta densidad', 'El confort que no se aplana.'],
              ['mat-3', 'Telas Catálogo Beloved', 'Cuatro tonos: Nube, Arena, Grafito y Olivo.'], ['mat-4', 'Patas de madera maciza', 'El remate.']] },
    { id: 'entregas', n: '04', t: 'Entregas', sub: 'De la fábrica a tu casa, con nuestro propio equipo.',
      slots: [['ent-1', 'Listo para salir', 'Protegido y empacado.'], ['ent-2', 'En camino', 'Nuestra camioneta.'], ['ent-3', 'La entrega', 'Lo subimos y lo colocamos.'], ['ent-4', 'En su nuevo hogar', 'Ya es tuyo.']] }
  ];
  const ALL = SECCIONES.flatMap(s => s.slots.map(([id, lbl, txt]) => ({ id, lbl, txt, sec: s.id })));

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } },
    set(o) { localStorage.setItem(KEY, JSON.stringify(o)); }   // puede lanzar QuotaExceededError
  };
  const built = () => (typeof IMGS !== 'undefined' && IMGS.galeria) || window.MIN_GALERIA || {};
  const foto = id => store.get()[id] || built()[id] || null;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const vacio = lbl => `<div class="gl-empty"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6l1.5-2.5h5L16 6"/><circle cx="12" cy="13" r="3.5"/></svg><span>${esc(lbl)}</span><small>Foto pendiente</small></div>`;

  /* ---------- página pública ---------- */
  function render(app, nav, foot) {
    const conFoto = ALL.filter(s => foto(s.id)).length;
    app.innerHTML = nav + `
    <section class="gl-hero wrap">
      <span class="pill">Quiénes somos</span>
      <h1>Fabricamos para otros.<br>Ahora, para ti.</h1>
      <p>No somos una tienda que revende. Somos la fábrica: llevamos 20 años haciendo muebles para tiendas y cadenas en México. Con Min abrimos un canal directo — mismos materiales, mismos procesos, sin intermediarios. No te lo contamos: te lo enseñamos.</p>
      <nav class="gl-jump">${SECCIONES.map(s => `<a href="#/fabrica?s=${s.id}" data-jump="${s.id}"><b>${s.n}</b>${s.t}</a>`).join('')}</nav>
    </section>
    ${SECCIONES.map(s => `
    <section class="gl-sec gl-${s.id}" id="gl-${s.id}">
      <div class="wrap">
        <header class="gl-h"><span class="gl-n">${s.n}</span><div><h2>${s.t}</h2><p>${s.sub}</p></div></header>
        <div class="gl-grid gl-grid-${s.slots.length}">
          ${s.slots.map(([id, lbl, txt], i) => {
            const src = foto(id);
            return `<figure class="gl-item ${i === 0 && s.slots.length !== 4 ? 'gl-big' : ''}">
              <div class="gl-img">${src ? `<img src="${src}" alt="${esc(lbl)} — Min" loading="lazy">` : vacio(lbl)}${s.id === 'proceso' ? `<span class="gl-step">${String(i + 1).padStart(2, '0')}</span>` : ''}</div>
              <figcaption><b>${esc(lbl)}</b><span>${esc(txt)}</span></figcaption>
            </figure>`;
          }).join('')}
        </div>
      </div>
    </section>`).join('')}
    <section class="gl-cta wrap">
      <h2>¿Ya viste cómo se hace?</h2>
      <a href="#/?scroll=catalogo-anchor" class="btn-primary">Elige tu mueble</a>
    </section>` + foot;
    app.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); const el = app.querySelector('#gl-' + a.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth' });
    }));
    const s = new URLSearchParams((location.hash.split('?')[1]) || '').get('s');
    if (s) setTimeout(() => { const el = app.querySelector('#gl-' + s); if (el) el.scrollIntoView(); }, 50); else window.scrollTo(0, 0);
    return conFoto;
  }

  /* ---------- compresión en el navegador ---------- */
  function comprimir(file, max, q) {
    return new Promise((ok, bad) => {
      const fr = new FileReader();
      fr.onerror = bad;
      fr.onload = () => {
        const im = new Image();
        im.onerror = () => bad(new Error('No se pudo leer la imagen'));
        im.onload = () => {
          const k = Math.min(1, max / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          ok(c.toDataURL('image/jpeg', q));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  const kb = s => Math.round(s.length * 0.75 / 1024);

  /* ---------- panel en el ERP ---------- */
  function admin(main, head, toast) {
    const g = store.get();
    const usado = Object.values(g).reduce((a, s) => a + kb(s), 0);
    const total = ALL.filter(s => foto(s.id)).length;
    main.innerHTML = head('Galería · Nuestra fábrica', `${total} de ${ALL.length} espacios con foto · <a href="#/fabrica" target="_blank">Ver página pública ↗</a>`) + `
      <div class="panel gl-tips">
        <p><b>Cómo funciona:</b> toca un espacio para subir o cambiar su foto. Se comprime sola (máx. 1600 px). Usa fotos horizontales, con buena luz, fondo limpio.</p>
        <p><b>Fotos de entregas:</b> solo con permiso del cliente y sin caras, números de casa ni placas (lo pide el aviso de privacidad).</p>
        <p class="muted sm">Prototipo: las fotos se guardan en este navegador (${(usado / 1024).toFixed(1)} MB usados de ~4 MB). En producción se suben al almacenamiento del servidor y no hay límite práctico.</p>
      </div>
      ${SECCIONES.map(s => `
        <div class="panel"><h3>${s.n} · ${s.t}</h3>
          <div class="gl-adm">
            ${s.slots.map(([id, lbl]) => {
              const src = foto(id), propia = !!g[id];
              return `<div class="gl-slot ${src ? 'has' : ''}">
                <label class="gl-drop">${src ? `<img src="${src}" alt="">` : vacio(lbl)}
                  <input type="file" accept="image/*" data-up="${id}" hidden>
                  <span class="gl-over">${src ? 'Cambiar foto' : 'Subir foto'}</span></label>
                <div class="gl-meta"><b>${esc(lbl)}</b>${propia ? `<button class="gl-rm" data-rm="${id}">Quitar</button>` : `<small>${src ? 'Foto base' : 'Vacío'}</small>`}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('')}`;

    main.querySelectorAll('[data-up]').forEach(inp => inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      if (!/^image\//.test(f.type)) return toast('Ese archivo no es una imagen');
      const slot = inp.closest('.gl-slot'); slot.classList.add('busy');
      try {
        let data = await comprimir(f, 1600, 0.78);
        const cur = store.get(); cur[inp.dataset.up] = data;
        try { store.set(cur); }
        catch (e) { data = await comprimir(f, 1100, 0.68); cur[inp.dataset.up] = data; store.set(cur); }
        toast('Foto guardada');
      } catch (e) {
        toast(e && e.name === 'QuotaExceededError' ? 'Sin espacio en este navegador: quita alguna foto' : 'No se pudo guardar la foto');
      }
      admin(main, head, toast);
    }));
    main.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
      const cur = store.get(); delete cur[b.dataset.rm]; store.set(cur); toast('Foto quitada'); admin(main, head, toast);
    }));
  }

  window.MinGaleria = { SECCIONES, ALL, foto, render, admin };
})();

</script>
<script>
/* ===== Min — Catálogo: fotos reales de producto (panel del ERP) =====
   Cada foto tiene su lugar:
   · Portada  — el sofá grande del inicio, 1 por color (4).
   · Tarjeta  — la foto de la tarjeta del catálogo y del carrito, 1 por modelo y color (20).
   · Ficha    — 5 tomas por modelo y color: Frente, 3/4, Lateral 90°, Escenario, Close up (100).
   Portada y Tarjeta necesitan fondo blanco: al subirlas se recorta solo el blanco sobrante y se
   muestra una vista previa antes de guardar. Todo sube a Supabase Storage por el backend, con la
   sesión de administrador (cookie firmada). El service_role key nunca toca el navegador. */
(function () {
  const PRODUCTS = [
    ['sofa', 'Sofá 2.40'], ['sofa2', 'Sofá 2.00'], ['sillon', 'Sillón'], ['chaise', 'Chaise'], ['cama', 'Cama']
  ];
  const TONOS = ['Nube', 'Arena', 'Grafito', 'Olivo'];
  const TONO_C = ['#E4E1DB', '#C9B8A0', '#4E5054', '#6E6C3F'];
  const FICHA = [
    ['frente', 'Frente', 'De frente'],
    ['tres_cuartos', '3/4', 'Girado 45°'],
    ['lateral', 'Lateral 90°', 'De perfil'],
    ['escenario', 'Escenario', 'En ambiente'],
    ['closeup', 'Close up', 'Tela y costuras']
  ];
  const BLANCO = { tarjeta: 1, portada: 1 };      // tomas que deben ir sobre fondo blanco
  let actual = 'sofa';

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const vacio = (lbl, hint) => `<div class="gl-empty"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6l1.5-2.5h5L16 6"/><circle cx="12" cy="13" r="3.5"/></svg><span>${esc(lbl)}</span><small>${esc(hint)}</small></div>`;
  const API_BASE = window.MIN_API_BASE || (location.protocol.startsWith('http') ? '' : 'https://min-casamins-projects.vercel.app');
  const api = (path, opts) => fetch(API_BASE + path, Object.assign({ credentials: 'include' }, opts));

  // Foto que la tienda muestra hoy si todavía no subes una.
  function fotoBase(pid, ti, kind) {
    if (typeof IMGS === 'undefined') return null;
    if (kind === 'tarjeta' || kind === 'portada' || kind === 'frente') return (IMGS[pid] || [])[ti] || null;
    if (kind === 'closeup') return (IMGS[pid + '_det'] || [])[ti] || null;
    return null;
  }

  function leerImagen(file) {
    return new Promise((ok, bad) => {
      const fr = new FileReader();
      fr.onerror = bad;
      fr.onload = () => { const im = new Image(); im.onerror = () => bad(new Error('No se pudo leer la imagen')); im.onload = () => ok(im); im.src = fr.result; };
      fr.readAsDataURL(file);
    });
  }
  // Reduce a máx. 1600 px. Para Portada/Tarjeta revisa si el fondo es blanco y recorta el blanco sobrante.
  async function procesar(file, blanco) {
    const im = await leerImagen(file);
    const k = Math.min(1, 1600 / Math.max(im.width, im.height));
    let c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(im, 0, 0, c.width, c.height);
    let fondoBlanco = null;
    if (blanco) {
      const { width: w, height: h } = c, d = g.getImageData(0, 0, w, h).data;
      const esBlanco = (x, y) => { const i = (y * w + x) * 4; return d[i] > 236 && d[i + 1] > 236 && d[i + 2] > 236; };
      let borde = 0, blancos = 0;
      for (let x = 0; x < w; x += 2) { borde += 2; blancos += esBlanco(x, 0) + esBlanco(x, h - 1); }
      for (let y = 0; y < h; y += 2) { borde += 2; blancos += esBlanco(0, y) + esBlanco(w - 1, y); }
      fondoBlanco = blancos / borde > 0.9;
      if (fondoBlanco) {
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!esBlanco(x, y)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 > x0 && y1 > y0) {
          const m = Math.round(Math.max(x1 - x0, y1 - y0) * 0.01);
          x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
          const c2 = document.createElement('canvas');
          c2.width = x1 - x0 + 1; c2.height = y1 - y0 + 1;
          c2.getContext('2d').drawImage(c, x0, y0, c2.width, c2.height, 0, 0, c2.width, c2.height);
          c = c2;
        }
      }
    }
    return { dataUrl: c.toDataURL('image/jpeg', 0.86), fondoBlanco };
  }

  // Vista previa de cómo queda en la tarjeta / portada antes de guardar.
  function vistaPrevia(kind, pid, dataUrl, fondoBlanco) {
    return new Promise(done => {
      const ov = document.createElement('div');
      ov.className = 'cat-pv-ov';
      const prod = (PRODUCTS.find(p => p[0] === pid) || [, ''])[1];
      const muestra = kind === 'portada'
        ? `<div class="cat-pv-hero"><img src="${dataUrl}" alt=""></div>`
        : `<div class="card cat-pv-card"><div class="imgbox"><a><img class="p-${pid}" src="${dataUrl}" alt=""></a></div><div class="toprow"><h3>${esc(prod)}</h3></div></div>`;
      ov.innerHTML = `<div class="cat-pv">
        <h3>Así se verá en ${kind === 'portada' ? 'la portada' : 'la tarjeta del catálogo'}</h3>
        ${fondoBlanco ? '<p class="muted sm">Recorté el blanco sobrante para que el mueble quede al mismo tamaño que los demás.</p>'
          : '<p class="cat-pv-warn"><b>Esta foto no tiene fondo blanco.</b> En ' + (kind === 'portada' ? 'la portada' : 'la tarjeta') + ' se va a ver distinta a las demás. Lo ideal es el mueble sobre fondo blanco.</p>'}
        ${muestra}
        <div class="cat-pv-btns"><button class="btn-secondary" data-no>Cancelar</button><button class="btn-primary" data-si>Guardar foto</button></div>
      </div>`;
      document.body.appendChild(ov);
      const fin = v => { ov.remove(); done(v); };
      ov.querySelector('[data-no]').onclick = () => fin(false);
      ov.querySelector('[data-si]').onclick = () => fin(true);
      ov.addEventListener('click', e => { if (e.target === ov) fin(false); });
    });
  }

  async function admin(main, head, toast) {
    main.innerHTML = head('Catálogo · Fotos de producto', 'Cargando…');
    let sess, errDetail = '';
    try { sess = await api('/api/admin/session').then(r => r.json()); }
    catch (e) { sess = null; errDetail = (e && (e.message || e.name)) || String(e); }
    if (!sess) {
      main.innerHTML = head('Catálogo · Fotos de producto', '') + `
        <div class="panel"><p><b>No hay conexión con el servidor.</b></p>
        <p class="muted sm">Este panel sube fotos de verdad (Supabase + Vercel), así que necesita abrirse desde la tienda publicada.</p>
        ${errDetail ? `<p class="muted sm" style="font-family:monospace;font-size:11px;opacity:.8">Detalle técnico: ${esc(errDetail)}</p>` : ''}</div>`;
      return;
    }
    if (!sess.admin) { main.innerHTML = head('Catálogo · Fotos de producto', 'Tu sesión expiró. Vuelve a entrar al ERP.'); return; }
    await renderGrid(main, head, toast);
  }

  function slot(byKey, pid, ti, kind, label, hint) {
    const f = byKey[`${pid}-${ti}-${kind}`];
    const base = f ? null : fotoBase(pid, ti, kind);
    const src = f ? f.url : base;
    const key = `${pid}|${ti}|${kind}`;
    return `<div class="gl-slot ${f || base ? 'has' : ''}">
      <label class="gl-drop ${BLANCO[kind] ? 'wb' : ''}">${src ? `<img src="${esc(src)}" alt="">` : vacio(label, hint)}
        <input type="file" accept="image/*" data-up="${key}" hidden>
        <span class="gl-over">${f || base ? 'Cambiar foto' : 'Subir foto'}</span></label>
      <div class="gl-meta"><b>${label}</b>${f ? `<button class="gl-rm" data-rm="${key}">Quitar</button>` : `<small>${base ? 'Foto actual' : 'Vacío'}</small>`}</div>
    </div>`;
  }

  async function renderGrid(main, head, toast) {
    let fotos = [];
    try { fotos = await api('/api/admin/photos').then(r => r.json()); } catch (e) { /* noop */ }
    const byKey = {};
    (Array.isArray(fotos) ? fotos : []).forEach(f => byKey[`${f.product}-${f.tone}-${f.kind}`] = f);
    const kindsModelo = ['tarjeta'].concat(FICHA.map(s => s[0]));
    const cuenta = pid => TONOS.reduce((n, _, ti) => n + kindsModelo.filter(k => byKey[`${pid}-${ti}-${k}`]).length, 0);
    const porModelo = kindsModelo.length * TONOS.length;
    const nPortada = TONOS.filter((_, ti) => byKey[`sofa-${ti}-portada`]).length;
    const total = nPortada + PRODUCTS.reduce((n, [pid]) => n + cuenta(pid), 0), max = TONOS.length + PRODUCTS.length * porModelo;
    const plabel = PRODUCTS.find(([p]) => p === actual)[1];

    main.innerHTML = head('Catálogo · Fotos de producto', `${total} de ${max} fotos subidas · <a href="#/" target="_blank">Ver tienda ↗</a>`) + `
      <div class="panel gl-tips">
        <p><b>Cada foto tiene su lugar.</b> <b>Portada</b>: el sofá grande del inicio. <b>Tarjeta</b>: la foto de cada mueble en el catálogo y el carrito. <b>Ficha</b>: las 5 fotos que se ven al abrir el producto, en este orden: Frente, 3/4, Lateral 90°, Escenario y Close up.</p>
        <p>Portada y Tarjeta van con el <b>mueble sobre fondo blanco</b>: al subirlas se recorta solo el blanco sobrante y ves cómo queda antes de guardar.</p>
      </div>

      <div class="panel">
        <h3>Portada <small class="cat-cnt">${nPortada}/${TONOS.length}</small></h3>
        <p class="muted sm" style="margin:4px 0 0">Sofá 2.40 en la portada del inicio. Cambia con los botones de color de la portada.</p>
        <div class="cat-row cat-row4">${TONOS.map((tono, ti) => slot(byKey, 'sofa', ti, 'portada', tono, 'Fondo blanco')).join('')}</div>
      </div>

      <div class="cat-tabs">${PRODUCTS.map(([pid, lbl]) => {
        const n = cuenta(pid);
        return `<button class="${pid === actual ? 'on' : ''}" data-prod="${pid}">${esc(lbl)} <small class="${n === porModelo ? 'ok' : ''}">${n}/${porModelo}</small></button>`;
      }).join('')}</div>
      <div class="panel">
        <h3>${esc(plabel)}</h3>
        <div class="cat-cols"><span>Tarjeta</span><span>Ficha del producto · 5 fotos</span></div>
        ${TONOS.map((tono, ti) => {
          const n = kindsModelo.filter(k => byKey[`${actual}-${ti}-${k}`]).length;
          return `<div class="cat-tone">
            <div class="cat-tone-h"><span class="cat-sw" style="background:${TONO_C[ti]}"></span><b>${tono}</b><small>${n}/${kindsModelo.length}</small></div>
            <div class="cat-row cat-row6">
              ${slot(byKey, actual, ti, 'tarjeta', 'Tarjeta', 'Fondo blanco')}
              ${FICHA.map(([k, klabel, hint]) => slot(byKey, actual, ti, k, klabel, hint)).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>`;

    main.querySelectorAll('[data-prod]').forEach(b => b.addEventListener('click', () => { actual = b.dataset.prod; renderGrid(main, head, toast); }));
    main.querySelectorAll('[data-up]').forEach(inp => inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      if (!/^image\//.test(f.type)) return toast('Ese archivo no es una imagen');
      const [product, tone, kind] = inp.dataset.up.split('|');
      const slotEl = inp.closest('.gl-slot'); slotEl.classList.add('busy');
      try {
        const { dataUrl, fondoBlanco } = await procesar(f, !!BLANCO[kind]);
        if (BLANCO[kind] && !(await vistaPrevia(kind, product, dataUrl, fondoBlanco))) { slotEl.classList.remove('busy'); inp.value = ''; return; }
        const r = await api('/api/admin/photos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ product, tone, kind, dataUrl }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'Error al subir');
        toast('Foto guardada');
      } catch (e) { toast(e.message || 'No se pudo subir la foto'); }
      renderGrid(main, head, toast);
    }));
    main.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', async () => {
      const [product, tone, kind] = b.dataset.rm.split('|');
      try {
        const r = await api(`/api/admin/photos?product=${product}&tone=${tone}&kind=${kind}`, { method: 'DELETE' });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'Error al quitar');
        toast('Foto quitada');
      } catch (e) { toast(e.message || 'No se pudo quitar'); }
      renderGrid(main, head, toast);
    }));

function getCart() { try { return JSON.parse(localStorage.getItem('min_cart') || '[]'); } catch (e) { return []; } }
function saveCart(cart) { localStorage.setItem('min_cart', JSON.stringify(cart)); updateCartBadge(); }
function addToCart(id, toneIdx, size, qty) {
  if (!size && PRODUCTS[id] && PRODUCTS[id].hasSize) size = PRODUCTS[id].sizes[1];
  const cart = getCart();
  const p = PRODUCTS[id];
  const lineId = id + '|' + toneIdx + '|' + (size || '');
  const existing = cart.find(i => i.lineId === lineId);
  const unitPrice = p.price + (size && p.sizePriceDelta ? p.sizePriceDelta[p.sizes.indexOf(size)] : 0);
  if (existing) existing.qty += qty;
  else cart.push({ lineId, id, name: p.name, img: p.imgs[toneIdx], cat: TONES[toneIdx].cat, tone: TONES[toneIdx].n, size: size || null, unitPrice, qty });
  saveCart(cart);
}
function removeFromCart(lineId) { saveCart(getCart().filter(i => i.lineId !== lineId)); }
function setQty(lineId, qty) { const cart = getCart(); const item = cart.find(i => i.lineId === lineId); if (item) { item.qty = Math.max(1, qty); saveCart(cart); } }
function cartCount() { return getCart().reduce((s, i) => s + i.qty, 0); }
function cartTotal() { return getCart().reduce((s, i) => s + i.qty * i.unitPrice, 0); }
function fmt(n) { return '$' + n.toLocaleString('es-MX'); }
/* ---- Pago a meses (con intereses, vía Mercado Pago) -----------------------------------
   Tasa mensual de referencia por plazo. NO es MSI: es financiamiento a meses con interés,
   igual que el que Mercado Libre/Mercado Pago muestran en su checkout. La tasa real la fija
   Mercado Pago según el banco y la tarjeta del cliente en el momento del pago — esto es un
   estimado para mostrar "desde" en el catálogo. [CONFIRMAR con el panel de Mercado Pago antes
   de publicar en producción: estas tasas son un supuesto, no un dato verificado]. */
const MESES_TASA = { 3: 0.025, 6: 0.030, 9: 0.033, 12: 0.035 }; // tasa mensual (decimal)
function pagoAMeses(precio, n) {
  const r = MESES_TASA[n];
  const pago = precio * r / (1 - Math.pow(1 + r, -n));
  return Math.round(pago);
}
function mesesBoxHTML(precio) {
  return `<div class="msi-box">
    <span class="msi-lbl">Págalo a meses</span>
    <div class="msi-opts">${[3, 6, 9, 12].map(n => `<span>${n}<b>${fmt(pagoAMeses(precio, n))}</b>/mes</span>`).join('')}</div>
    <small class="msi-note">Financiado a meses con Mercado Pago.</small>
  </div>`;
}
function updateCartBadge() { document.querySelectorAll('[data-cart-badge]').forEach(el => el.textContent = cartCount()); }

function showToast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

  }
  return '<span class="stars">' + out + '</span>';
}

  const SLOTS = [['tres_cuartos', 'Tres cuartos'], ['lateral', 'Lateral 90°'], ['escenario', 'Escenario']];
  function placeholder(lbl) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#F2F3F5"/><rect x="24" y="24" width="1152" height="852" rx="28" fill="none" stroke="#C9CDD2" stroke-width="4" stroke-dasharray="18 14"/><g transform="translate(600 380)" fill="none" stroke="#9AA0A6" stroke-width="10" stroke-linejoin="round"><rect x="-90" y="-55" width="180" height="125" rx="18"/><path d="M-40 -55l14-28h52l14 28"/><circle cx="0" cy="8" r="36"/></g><text x="600" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#4A4D52">${lbl}</text><text x="600" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#8A8F96">Foto pendiente</text></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function slides() {
    const extra = p.fotos[state.tone] || [], up = p.up || {};
    // full = la foto llena el cuadro (fotos con fondo y cuadros pendientes); el Frente recortado sobre blanco se muestra completo.
    const slots = SLOTS.map(([k, lbl], i) => up[k + state.tone] ? { src: up[k + state.tone], lbl, full: true } : extra[i] ? { src: extra[i].src, lbl: extra[i].lbl, full: true } : { src: placeholder(lbl), lbl, full: true });
    const frente = up['frente' + state.tone];
    return [{ src: frente || p.imgs[state.tone], lbl: 'Frente', full: !!frente }].concat(slots, [{ src: p.det[state.tone], lbl: 'Close up', full: true }], extra.slice(3).map(f => ({ src: f.src, lbl: f.lbl, full: true })));
  }
  function goSlide(i) {
    const n = slides().length;
    state.slide = (i + n) % n;
    renderGallery();
  }
  function renderGallery() {
    const S = slides(), cur = S[state.slide];
    const main = $('#mainImg');

  $('#galNext').addEventListener('click', () => goSlide(state.slide + 1));
  (function () {
    const galMain = $('.gal-main');
    let startX = null;
    galMain.addEventListener('pointerdown', e => { startX = e.clientX; });
    galMain.addEventListener('pointerup', e => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 40) goSlide(state.slide + (dx < 0 ? 1 : -1));
      startX = null;

  function renderDims() {

  function renderQty() { app.querySelector('#qtyVal').textContent = state.qty; }
  app.querySelector('#qtyMinus').addEventListener('click', () => { state.qty = Math.max(1, state.qty - 1); renderQty(); });
  app.querySelector('#qtyPlus').addEventListener('click', () => { state.qty += 1; renderQty(); });
  app.querySelector('#addBtn').addEventListener('click', () => { addToCart(id, state.tone, state.size, state.qty); showToast(p.name + ' agregado al carrito'); });
  app.querySelector('#buyBtn').addEventListener('click', () => { addToCart(id, state.tone, state.size, state.qty); location.hash = '#/carrito'; });

  app.querySelectorAll('.tabbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      app.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active'));
      app.querySelectorAll('.tabpanel').forEach(pnl => pnl.classList.remove('active'));
      btn.classList.add('active');
      app.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active');
    });
  });

  renderPrice(); renderSize(); renderTone(); renderDims(); renderQty();

  const dist = [70, 20, 6, 3, 1];
  app.querySelector('#revBars').innerHTML = [5,4,3,2,1].map((n,i) => `
    <div class="rev-bar-row"><span style="width:14px">${n}</span><div class="rev-bar-track"><div class="rev-bar-fill" style="width:${dist[i]}%"></div></div><span style="width:30px;text-align:right">${dist[i]}%</span></div>
  `).join('');
  app.querySelector('#revCards').innerHTML = p.reviews.map(r => `<div class="rev-card"><div class="who">${r.who} ${starsSvg(r.stars, 14)}</div><p>${r.text}</p></div>`).join('');

  const others = Object.values(PRODUCTS).filter(x => x.id !== id).slice(0, 3);
  app.querySelector('#crossGrid').innerHTML = others.map(o => `
    <a href="#/producto?id=${o.id}" class="card" style="text-decoration:none">
      <div class="imgbox"><img class="p-${o.id}" src="${imgFor(o.id)}" alt="${o.name}"></div>
      <div class="toprow"><h3>${o.name}</h3><div class="price">${fmt(o.price)}</div></div>
      <p class="desc">${o.desc}</p>
    </a>
  `).join('');

  updateCartBadge();
  window.scrollTo(0, 0);
}

      <button class="btn-primary" id="checkoutBtn" style="width:100%;margin-top:20px">Finalizar compra</button>

    body.querySelectorAll('[data-line]').forEach(row => {
      const lineId = row.dataset.line;

      row.querySelector('[data-remove]').addEventListener('click', () => { removeFromCart(lineId); draw(); });

    MinFlete.bindFleteCart(body, draw);

const HERO = [null, null, null, null];           // portada subida desde el ERP (por color)
function heroSrc(t) { return HERO[t] || imgFor('sofa', t); }
/* ================= REGRESO DE MERCADO PAGO ================= */
function renderGracias(app, params) {
  const id = params.get('order') || '';
  app.innerHTML = navHtml() + `<div class="cartpage"><div id="gxBody"><div class="confirm-box"><p style="color:var(--mute2);margin:0">Revisando tu pago…</p></div></div></div>` + footerHtml();
  updateCartBadge(); window.scrollTo(0, 0);
  const body = app.querySelector('#gxBody');
  const check = ok => `<div class="check" style="${ok ? '' : 'background:#8A8F96'}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ok ? '<path d="M20 6L9 17l-5-5"></path>' : '<path d="M12 7v6M12 17h.01"></path>'}</svg></div>`;
  let email = ''; try { const u = JSON.parse(sessionStorage.getItem('min_ultimo_pedido') || '{}'); if (u.id === id) email = u.email || ''; } catch (e) {}
  let intentos = 0;
  function pinta(o) {
    if (o.pago === 'aprobado') {
      saveCart([]); updateCartBadge();
      body.innerHTML = `<div class="confirm-box">${check(true)}
        <h2 style="margin:0 0 8px;font-weight:900;font-size:26px">¡Pago aprobado!</h2>
        <p style="color:var(--mute2);margin:0 0 4px">Pedido ${o.id} · Total ${fmt(o.total)}</p>
        <p style="color:var(--mute2);margin:0 0 4px">${o.flete && o.flete.costo ? 'Flete: ' + MinFlete.FLETE[o.flete.tipo].name : 'Flete gratis'} · Fabricación 3 semanas</p>
        <p style="color:var(--mute);font-size:13px;max-width:380px;margin:12px auto 0">${email ? 'Te mandamos la confirmación a ' + email + '. ' : ''}Te avisamos por WhatsApp cuando tu mueble esté listo.</p>
        <a href="#/" class="btn-primary" style="margin-top:24px;display:inline-flex">Seguir viendo el catálogo</a></div>`;
    } else if (o.pago === 'pendiente' && pagoIniciado) {
      saveCart([]); updateCartBadge();
      body.innerHTML = `<div class="confirm-box">${check(false)}
        <h2 style="margin:0 0 8px;font-weight:900;font-size:26px">Tu pago está en proceso</h2>
        <p style="color:var(--mute2);margin:0 0 4px">Pedido ${o.id} · Total ${fmt(o.total)}</p>
        <p style="color:var(--mute);font-size:13px;max-width:400px;margin:12px auto 0">Si pagaste en OXXO o por transferencia, se acredita en cuanto Mercado Pago lo confirme. Tu pedido entra a fabricación en ese momento y te avisamos.</p>
        <a href="#/" class="btn-primary" style="margin-top:24px;display:inline-flex">Seguir viendo el catálogo</a></div>`;
    } else {
      body.innerHTML = `<div class="confirm-box">${check(false)}
        <h2 style="margin:0 0 8px;font-weight:900;font-size:26px">El pago no se completó</h2>
        <p style="color:var(--mute2);margin:0 0 4px">No se hizo ningún cargo. Tu carrito sigue aquí para intentarlo de nuevo.</p>
        <a href="#/carrito" class="btn-primary" style="margin-top:24px;display:inline-flex">Volver al carrito</a></div>`;
    }
  }
  const status = params.get('status') || params.get('collection_status') || '';
  const pid = params.get('payment_id') || params.get('collection_id') || '';
  const pagoIniciado = !!pid && pid !== 'null' && status !== 'rejected' && status !== 'null';
  function consulta() {
    fetch('/api/order-status?id=' + encodeURIComponent(id) + (pid && pid !== 'null' ? '&payment_id=' + encodeURIComponent(pid) : ''))
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(o => {
        if (o.pago !== 'aprobado' && status === 'approved' && intentos++ < 5) { setTimeout(consulta, 2500); return; }
        pinta(o);
      })
      .catch(() => { body.innerHTML = `<div class="confirm-box"><p style="color:var(--mute2)">No pudimos revisar el pedido ${id} en este momento. Si ya pagaste, está registrado; te contactamos pronto.</p><a href="#/" class="btn-primary" style="margin-top:20px;display:inline-flex">Ir al inicio</a></div>`; });
  }
  consulta();
}

function imgFor(id, toneIdx) { const p = PRODUCTS[id]; if (!p) return ''; return p.imgs[toneIdx != null ? toneIdx : p.defaultTone]; }

/* ================= ROUTER ================= */
(function () {
  const q = new URLSearchParams(location.search);
  if (/^MIN-\d+$/.test(q.get('order') || '')) history.replaceState(null, '', location.pathname + '#/gracias?' + q.toString());
})();
function router() {
  const app = document.getElementById('app');
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  const params = new URLSearchParams(qs || '');
  document.body.classList.remove('erp-on');
  if (path === '/erp') { MinERP.mount(app); window.scrollTo(0, 0); return; }
  if (path === '/producto') renderProducto(app, params.get('id') || 'sofa');
  else if (path === '/legal') { MinLegal.render(app, params.get('doc'), navHtml(), footerHtml()); updateCartBadge(); }
  else if (path === '/fabrica') { MinGaleria.render(app, navHtml(), footerHtml()); updateCartBadge(); }
  else if (path === '/carrito') renderCarrito(app);
  else if (path === '/gracias') renderGracias(app, params);
  else renderHome(app, params.get('scroll'));
}
window.addEventListener('hashchange', router);

/* ===== Fotos reales subidas desde el ERP (Catálogo) — cada una en su lugar =====
   portada → portada del inicio · tarjeta → tarjeta del catálogo y carrito
   frente, tres_cuartos, lateral, escenario, closeup → las 5 fotos de la ficha */
const FICHA_UP = ['frente', 'tres_cuartos', 'lateral', 'escenario', 'closeup'];
function aplicarFotos(rows) {
  rows.forEach(r => {
    const p = PRODUCTS[r.product], t = Number(r.tone);
    if (!p || !(t >= 0 && t <= 3) || !r.url) return;
    if (r.kind === 'portada' && r.product === 'sofa') HERO[t] = r.url;
    else if (r.kind === 'tarjeta') p.imgs[t] = r.url;
    else if (r.kind === 'closeup') p.det[t] = r.url;
    else if (FICHA_UP.includes(r.kind)) (p.up = p.up || {})[r.kind + t] = r.url;
  });
  Object.values(PRODUCTS).forEach(p => { p.img = p.imgs[p.defaultTone]; });
}
// La primera pantalla espera las fotos máx. 800 ms para no mostrar una foto y luego cambiarla.
let primeraVista = false;
const fotosListas = /^https?:$/.test(location.protocol)
  ? fetch('/api/photos').then(r => r.ok ? r.json() : []).then(rows => {
      if (!Array.isArray(rows) || !rows.length) return;
      aplicarFotos(rows);
      if (primeraVista && (location.hash.slice(1) || '/').split('?')[0] !== '/erp') router();
    }).catch(() => {})
  : Promise.resolve();
window.addEventListener('DOMContentLoaded', () => {
  Promise.race([fotosListas, new Promise(r => setTimeout(r, 800))]).then(() => { primeraVista = true; router(); });
});
</script>
